<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>五鮮級叫貨記錄</title>
  <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: "Noto Sans TC", "PingFang TC", sans-serif; background: #f0f4f0; color: #222; font-size: 16px; }

    header { background: #1e6b3e; color: white; padding: 16px 20px; text-align: center; }
    header h1 { font-size: 1.2rem; font-weight: 700; }

    .main { max-width: 520px; margin: 0 auto; padding: 16px 14px 40px; }

    .card { background: white; border-radius: 14px; box-shadow: 0 2px 10px rgba(0,0,0,.08); padding: 18px 16px; margin-bottom: 14px; }

    .action-row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
    .btn { padding: 9px 16px; border: none; border-radius: 8px; font-size: 0.88rem; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; gap: 5px; }
    .btn:active { opacity: .8; }
    .btn-purple { background: #6a1b9a; color: white; flex: 1; justify-content: center; }
    .btn-blue   { background: #1565c0; color: white; }
    .btn-orange { background: #e65100; color: white; }

    .date-row { display: flex; gap: 8px; align-items: center; }
    .date-row input[type=date] {
      flex: 1; padding: 8px 10px; border: 1.5px solid #ddd; border-radius: 8px;
      font-size: 0.92rem; font-family: inherit;
    }
    .date-row input[type=date]:focus { outline: none; border-color: #1e6b3e; }
    .btn-gray { background: #e0e0e0; color: #555; }

    .section-title { font-weight: 700; color: #1e6b3e; font-size: 0.92rem; margin-bottom: 12px; display: flex; align-items: center; gap: 6px; }
    .live-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #4caf50; animation: blink 1.5s infinite; flex-shrink: 0; }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:.3} }

    table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
    th { text-align: left; padding: 6px 8px; color: #888; font-weight: 600; font-size: 0.8rem; border-bottom: 1.5px solid #e8f5e9; }
    td { padding: 9px 8px; border-bottom: 1px solid #f5f5f5; }
    tr:last-child td { border-bottom: none; }
    .qty-cell { font-weight: 700; color: #1e6b3e; text-align: right; }
    tfoot td { font-weight: 700; border-top: 2px solid #e8f5e9; padding-top: 10px; }
    tfoot .qty-cell { color: #1e6b3e; }

    .no-orders { text-align: center; color: #bbb; padding: 24px 0; font-size: 0.92rem; }

    #toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
             background: #333; color: white; padding: 10px 22px; border-radius: 22px;
             font-size: 0.88rem; opacity: 0; transition: opacity .3s; pointer-events: none; z-index: 99; }
  </style>
</head>
<body>

<header>
  <h1>五鮮級叫貨記錄</h1>
</header>

<div class="main">

  <div class="card">
    <div class="action-row">
      <label class="btn btn-purple" style="cursor:pointer;">
        📱 上傳 LINE 訊息
        <input type="file" id="lineFileInput" accept=".txt" style="display:none" onchange="handleLineFile(event)">
      </label>
      <button class="btn btn-blue" onclick="exportExcel()">⬇ 下載 Excel</button>
      <button class="btn btn-orange" onclick="clearDate()">🗑 清除</button>
    </div>
    <div class="date-row">
      <input type="date" id="viewDate" onchange="onDateChange()">
    </div>
  </div>

  <div class="card">
    <div class="section-title">
      <span class="live-dot"></span>
      <span id="listTitle">載入中…</span>
    </div>
    <div id="orderList"><div class="no-orders">尚無資料</div></div>
  </div>

</div>

<!-- LINE 匯入 Modal -->
<div id="lineModal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:300;overflow-y:auto;padding:16px;">
  <div style="background:white;border-radius:14px;max-width:540px;margin:0 auto;padding:20px;">
    <div style="font-weight:700;font-size:1rem;margin-bottom:4px;">📱 LINE 訂單預覽</div>
    <div id="lineModalSub" style="font-size:0.82rem;color:#666;margin-bottom:14px;"></div>
    <div id="lineModalBody" style="max-height:60vh;overflow-y:auto;"></div>
    <div style="display:flex;gap:8px;margin-top:14px;">
      <button id="lineConfirmBtn" style="flex:1;background:#2e7d32;color:white;border:none;border-radius:8px;padding:10px;font-size:0.9rem;font-weight:600;cursor:pointer;" onclick="confirmLineImport()">✓ 確認匯入</button>
      <button style="flex:1;background:#eee;border:none;border-radius:8px;padding:10px;font-size:0.9rem;cursor:pointer;" onclick="closeLineModal()">取消</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
const STORES = [
  { r:"新竹", n:"新豐店" },
  { r:"新竹", n:"環北店" },
  { r:"新竹", n:"旗艦店" },

  { r:"台中", n:"中興店" },
  { r:"台中", n:"豐原店" },
  { r:"台中", n:"霧峰店" },

  { r:"南投", n:"埔里店" },
  { r:"南投", n:"草屯店" },

  { r:"彰化", n:"員林店" },
  { r:"彰化", n:"社頭店" },
  { r:"彰化", n:"北斗店" },
  { r:"彰化", n:"溪湖店" },
  { r:"彰化", n:"和美店" },
  { r:"彰化", n:"彰中店" },
  { r:"彰化", n:"鹿港店" },

  { r:"雲林", n:"斗六店" },
  { r:"雲林", n:"西螺店" },
  { r:"雲林", n:"北港店" },

  { r:"嘉義", n:"民族店" },
  { r:"嘉義", n:"水上店" },
  { r:"嘉義", n:"大林店" },
  { r:"嘉義", n:"太保店" },
  { r:"嘉義", n:"新港店" },
  { r:"嘉義", n:"朴子店" },

  { r:"台南", n:"大灣店" },
  { r:"台南", n:"新營店" },
  { r:"台南", n:"國平店" },
  { r:"台南", n:"仁德店" },
  { r:"台南", n:"永康店" },
  { r:"台南", n:"東平店" },
  { r:"台南", n:"安南店" },
  { r:"台南", n:"新市店" },
  { r:"台南", n:"永成店" },
  { r:"台南", n:"善化店" },
  { r:"台南", n:"佳里店" },
  { r:"台南", n:"麻豆店" },
  { r:"台南", n:"學甲店" },

  { r:"高雄", n:"路竹店" },
  { r:"高雄", n:"新鼓山店" },
  { r:"高雄", n:"建工店", closeDate:"2026-05-24" },
  { r:"高雄", n:"小港店" },
  { r:"高雄", n:"鳳山店" },
  { r:"高雄", n:"七賢店" },
  { r:"高雄", n:"楠梓店" },
  { r:"高雄", n:"藍田店" },
  { r:"高雄", n:"寶陽店" },
  { r:"高雄", n:"岡山旗艦店" },
  { r:"高雄", n:"鼎力店" },
  { r:"高雄", n:"左營店" },
  { r:"高雄", n:"仁武店" },
  { r:"高雄", n:"旗山店" },
  { r:"高雄", n:"林園店" },
  { r:"高雄", n:"大昌店" },

  { r:"屏東", n:"東港店" },
  { r:"屏東", n:"潮州店" },
  { r:"屏東", n:"公園店" },
  { r:"屏東", n:"永大店" },
  { r:"屏東", n:"里港店" },

  { r:"燒甲", n:"燒甲佳里店" },
  { r:"燒甲", n:"燒甲陽明店" },
  { r:"燒甲", n:"燒甲嘉義民北店" },
];

const WEEKDAYS = ["日","一","二","三","四","五","六"];

const firebaseConfig = {
  apiKey: "AIzaSyBB9jPOLfJTBcW6bu1UL-KcF5SIaHhricA",
  authDomain: "hanbaoclam-2c65e.firebaseapp.com",
  projectId: "hanbaoclam-2c65e",
  storageBucket: "hanbaoclam-2c65e.firebasestorage.app",
  messagingSenderId: "155015616415",
  appId: "1:155015616415:web:b0e9988185778a00c20faa"
};
if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

let currentDate = "";
let todayOrders = {};
let unsubscribe = null;

function fmtDate(d) {
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,"0");
  const day = String(d.getDate()).padStart(2,"0");
  return `${y}-${m}-${day}`;
}
function fmtShort(str) {
  if (!str) return "";
  const d = new Date(str + "T00:00:00");
  return `${d.getMonth()+1}/${d.getDate()}（${WEEKDAYS[d.getDay()]}）`;
}
function escHtml(s) {
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}

window.onload = () => {
  const today = fmtDate(new Date());
  document.getElementById("viewDate").value = today;
  setViewDate(today);
};

function onDateChange() {
  const d = document.getElementById("viewDate").value;
  if (d) setViewDate(d);
}

function setViewDate(dateStr) {
  currentDate = dateStr;
  if (unsubscribe) unsubscribe();
  const docId = `五鮮級_${currentDate}`;
  unsubscribe = db.collection("orders_wuxian").doc(docId).onSnapshot(snap => {
    todayOrders = (snap.exists && snap.data().stores) ? snap.data().stores : {};
    renderOrderList();
  });
}

function renderOrderList() {
  document.getElementById("listTitle").textContent = fmtShort(currentDate) + " 叫貨";

  const entries = Object.entries(todayOrders)
    .filter(([, qty]) => qty > 0)
    .sort(([a], [b]) => {
      const ai = STORES.findIndex(s => s.n === a);
      const bi = STORES.findIndex(s => s.n === b);
      return (ai === -1 ? 999 : ai) - (bi === -1 ? 999 : bi);
    });

  const box = document.getElementById("orderList");
  if (!entries.length) {
    box.innerHTML = '<div class="no-orders">這天沒有叫貨記錄</div>';
    return;
  }

  const total = entries.reduce((s, [, q]) => s + q, 0);
  box.innerHTML = `<table>
    <thead><tr><th>門市</th><th style="text-align:right;">包數</th></tr></thead>
    <tbody>
      ${entries.map(([name, qty]) => `
        <tr><td>${escHtml(name)}</td><td class="qty-cell">${qty}</td></tr>
      `).join("")}
    </tbody>
    <tfoot><tr>
      <td>共 ${entries.length} 家</td>
      <td class="qty-cell">${total} 包</td>
    </tr></tfoot>
  </table>`;
}

function clearDate() {
  if (!confirm(`確定清除 ${fmtShort(currentDate)} 的所有記錄？`)) return;
  db.collection("orders_wuxian").doc(`五鮮級_${currentDate}`).delete()
    .then(() => toast("已清除"))
    .catch(e => toast("失敗：" + e.message));
}

function exportExcel() {
  const wb = XLSX.utils.book_new();
  const header = ["區域", "門市", "包數"];
  const rows = [header];
  STORES.forEach(s => {
    const qty = todayOrders[s.n] || 0;
    rows.push([s.r, s.n, qty]);
  });
  Object.keys(todayOrders).forEach(name => {
    if (!STORES.find(s => s.n === name) && todayOrders[name] > 0)
      rows.push(["其他", name, todayOrders[name]]);
  });
  const ws = XLSX.utils.aoa_to_sheet(rows);
  ws["!cols"] = [{wch:6},{wch:14},{wch:8}];
  XLSX.utils.book_append_sheet(wb, ws, currentDate.replace(/-/g,""));
  XLSX.writeFile(wb, `五鮮級_${currentDate}.xlsx`);
  toast("✓ Excel 已下載");
}

let _toastTimer;
function toast(msg) {
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.style.opacity = 1;
  clearTimeout(_toastTimer);
  _toastTimer = setTimeout(() => el.style.opacity = 0, 2400);
}

// ── LINE 訂單匯入 ─────────────────────────────────────
let _parsedLineOrders = [];

function handleLineFile(evt) {
  const file = evt.target.files[0];
  evt.target.value = "";
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    _parsedLineOrders = parseLineOrders(e.target.result);
    showLineModal();
  };
  reader.readAsText(file, "UTF-8");
}

function parseLineOrders(text) {
  const lines = text.split(/\r?\n/);
  let year = new Date().getFullYear();
  let month = 1, day = 1;
  let blocks = [];
  let cur = null;

  for (const raw of lines) {
    const line = raw.trim();
    if (!line) continue;

    // 日期標題：2026.05.07 星期四
    const dh = line.match(/^(\d{4})\.(\d{2})\.(\d{2})\s+星期/);
    if (dh) {
      year = parseInt(dh[1]);
      month = parseInt(dh[2]);
      day = parseInt(dh[3]);
      if (cur) blocks.push(cur);
      cur = null;
      continue;
    }

    // 訊息開頭：HH:MM 發送者 內容
    const mh = line.match(/^(\d{2}):(\d{2})\s+([\s\S]*)/);
    if (mh) {
      if (cur) blocks.push(cur);
      // 用這則訊息所在的聊天日期當下單日期
      const orderDate = `${year}-${String(month).padStart(2,"0")}-${String(day).padStart(2,"0")}`;
      cur = { text: mh[3], orderDate };
      continue;
    }

    if (cur && !line.startsWith("上傳者：")) cur.text += "\n" + line;
  }
  if (cur) blocks.push(cur);

  const orders = [];
  for (const b of blocks) {
    const t = b.text;
    const qM = t.match(/蛤蜊[^：:\n]*[：:]\s*(\d+)/);
    if (!qM) continue;

    const sM = t.match(/店[\s　]*名[：:]\s*([^\n]*)/);
    let rawStore = sM ? sM[1].trim() : "";

    if (!rawStore) {
      const firstLine = t.split("\n")[0];
      const fm = firstLine.match(/五鮮級[\s-]?(\S+店)/) || firstLine.match(/(\S+店)\s*$/);
      if (fm) rawStore = fm[1];
    }
    // 店名必須以「店」結尾，否則是解析錯誤
    if (rawStore && !rawStore.endsWith("店")) {
      const m = rawStore.match(/(\S+店)/);
      rawStore = m ? m[1] : "";
    }
    if (!rawStore) continue;

    const qty = parseInt(qM[1]);
    if (qty < 1) continue;

    const matchedName = matchStoreName(rawStore);
    orders.push({ rawStore, matchedName, qty, orderDate: b.orderDate });
  }
  return orders;
}

function matchStoreName(raw) {
  if (!raw) return null;
  const norm = raw.replace(/^五鮮級[-－\s]?/, "").trim();
  let found = STORES.find(s => s.n === raw || s.n === norm);
  if (found) return found.n;
  found = STORES.find(s => norm.includes(s.n) || s.n.includes(norm));
  return found ? found.n : null;
}

function showLineModal() {
  if (!_parsedLineOrders.length) {
    toast("找不到訂單格式，請確認是否為正確的 LINE 匯出檔");
    return;
  }

  const byDate = {};
  _parsedLineOrders.forEach(o => {
    if (!byDate[o.orderDate]) byDate[o.orderDate] = [];
    byDate[o.orderDate].push(o);
  });

  const unmatched = _parsedLineOrders.filter(o => !o.matchedName).length;
  let sub = `共解析 ${_parsedLineOrders.length} 筆`;
  if (unmatched) sub += `，${unmatched} 筆店名未比對到（以原始名稱存入）`;
  document.getElementById("lineModalSub").textContent = sub;

  let html = "";
  for (const date of Object.keys(byDate).sort()) {
    const rows = byDate[date];
    html += `<div style="margin-bottom:14px;">
      <div style="font-weight:600;font-size:0.88rem;margin-bottom:6px;color:#333;">
        ${fmtShort(date)} 下單（${rows.length} 筆）
      </div>
      <table style="width:100%;border-collapse:collapse;font-size:0.84rem;">
        <thead><tr style="background:#f0f0f0;">
          <th style="padding:5px 8px;text-align:left;border:1px solid #ddd;">LINE 店名</th>
          <th style="padding:5px 8px;text-align:center;border:1px solid #ddd;">包數</th>
          <th style="padding:5px 8px;text-align:left;border:1px solid #ddd;">比對</th>
        </tr></thead>
        <tbody>`;
    rows.forEach(o => {
      const status = o.matchedName
        ? `<span style="color:#2e7d32;">✓ ${escHtml(o.matchedName)}</span>`
        : `<span style="color:#c62828;">⚠ 未比對</span>`;
      html += `<tr>
        <td style="padding:5px 8px;border:1px solid #ddd;">${escHtml(o.rawStore)}</td>
        <td style="padding:5px 8px;text-align:center;border:1px solid #ddd;">${o.qty}</td>
        <td style="padding:5px 8px;border:1px solid #ddd;">${status}</td>
      </tr>`;
    });
    html += `</tbody></table></div>`;
  }

  document.getElementById("lineModalBody").innerHTML = html;
  document.getElementById("lineModal").style.display = "block";
}

function closeLineModal() {
  document.getElementById("lineModal").style.display = "none";
  _parsedLineOrders = [];
}

async function confirmLineImport() {
  if (!_parsedLineOrders.length) return;

  const byDate = {};
  _parsedLineOrders.forEach(o => {
    const name = o.matchedName || o.rawStore;
    if (!byDate[o.orderDate]) byDate[o.orderDate] = {};
    byDate[o.orderDate][name] = o.qty;
  });

  const btn = document.getElementById("lineConfirmBtn");
  btn.disabled = true; btn.textContent = "匯入中…";

  try {
    await Promise.all(Object.entries(byDate).map(([date, stores]) =>
      db.collection("orders_wuxian").doc(`五鮮級_${date}`).set(
        { stores, date, updatedAt: new Date().toISOString() },
        { merge: true }
      )
    ));
    closeLineModal();
    toast(`已匯入 ${_parsedLineOrders.length} 筆叫貨記錄`);
  } catch(e) {
    toast("匯入失敗：" + e.message);
    btn.disabled = false; btn.textContent = "✓ 確認匯入";
  }
}
</script>
</body>
</html>
