<!DOCTYPE html>
<html lang="zh-Hant">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>五鮮級下單</title>
  <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

                  border-radius: 20px; padding: 4px 14px; font-size: 0.88rem; }

    .main { max-width: 480px; margin: 0 auto; padding: 20px 16px 40px; }

    .card { background: white; border-radius: 14px; box-shadow: 0 2px 10px rgba(0,0,0,.08); padding: 22px 20px; margin-bottom: 16px; }

    label { display: block; font-weight: 600; margin-bottom: 8px; color: #444; font-size: 0.92rem; }
    .store-input-wrap { position: relative; }
    input[type=text], select, input[type=number] {
      width: 100%; padding: 13px 14px; border: 1.5px solid #ddd; border-radius: 10px;
      font-size: 1rem; font-family: inherit; color: #222; background: #fafafa;
      appearance: none; -webkit-appearance: none;
    }
    input[type=text]:focus, select:focus, input[type=number]:focus { outline: none; border-color: #1e6b3e; background: white; }
    .store-select-toggle { font-size: 0.78rem; color: #888; margin-top: 6px; cursor: pointer;
                           text-decoration: underline; background: none; border: none; padding: 0; }
    select.store-select { margin-top: 8px; display: none; }
    select.store-select.show { display: block; }
    .qty-wrap { margin-top: 14px; }
    .qty-row { display: flex; align-items: center; gap: 10px; }
    .qty-row input { text-align: center; font-size: 1.4rem; font-weight: 700; }
    .qty-btn { width: 48px; height: 48px; border: none; border-radius: 10px;
               background: #e8f5e9; color: #1e6b3e; font-size: 1.6rem; font-weight: 700;
               cursor: pointer; flex-shrink: 0; display: flex; align-items: center; justify-content: center; }
    .qty-btn:active { background: #c8e6c9; }

    .btn-submit { display: block; width: 100%; padding: 16px; background: #1e6b3e; color: white;
                  border: none; border-radius: 12px; font-size: 1.1rem; font-weight: 700;
                  cursor: pointer; margin-top: 18px; letter-spacing: .06em; }
    .btn-submit:active { background: #155230; }
    .btn-submit:disabled { background: #aaa; cursor: not-allowed; }

    /* 送出成功畫面 */
    .success-card { text-align: center; padding: 30px 20px; }
    .success-icon { font-size: 3rem; margin-bottom: 10px; }
    .success-title { font-size: 1.3rem; font-weight: 700; color: #1e6b3e; margin-bottom: 6px; }
    .success-sub { color: #666; font-size: 0.92rem; margin-bottom: 20px; }
    .btn-edit { padding: 10px 24px; border: 1.5px solid #1e6b3e; color: #1e6b3e;
                background: white; border-radius: 8px; font-size: 0.95rem; cursor: pointer; font-weight: 600; }

    /* 今日訂單列表 */
    .order-list { margin-top: 6px; }
    .order-item { display: flex; justify-content: space-between; align-items: center;
                  padding: 8px 0; border-bottom: 1px solid #f0f0f0; }
    .order-item:last-child { border-bottom: none; }
    .order-name { font-weight: 600; }
    .order-qty { font-weight: 700; color: #1e6b3e; }
    .no-orders { text-align: center; color: #bbb; padding: 20px 0; font-size: 0.92rem; }
    .order-total { display: flex; justify-content: space-between; padding: 10px 0 0;
                   border-top: 2px solid #e8f5e9; margin-top: 6px; font-weight: 700; color: #1e6b3e; }

    /* 管理員區塊 */
    .admin-toggle { text-align: center; margin-bottom: 12px; }
    .btn-link { background: none; border: none; color: #999; font-size: 0.82rem;
                cursor: pointer; text-decoration: underline; }
    .admin-panel { display: none; }
    .admin-panel.open { display: block; }
    .admin-row { display: flex; gap: 8px; flex-wrap: wrap; }
    .btn-sm { padding: 9px 16px; border: none; border-radius: 8px; font-size: 0.88rem;
              cursor: pointer; font-weight: 600; }
    .btn-blue   { background: #1565c0; color: white; }
    .btn-orange { background: #e65100; color: white; }
    .btn-gray   { background: #e0e0e0; color: #555; }
    .btn-sm:active { opacity: .8; }
    .date-set-row { display: flex; gap: 8px; align-items: center; margin-bottom: 12px; }
    .date-set-row input[type=date] { flex: 1; padding: 9px 12px; border: 1.5px solid #ddd;
                                      border-radius: 8px; font-size: 0.92rem; font-family: inherit; }
    .date-set-row input[type=date]:focus { outline: none; border-color: #1e6b3e; }
    .live-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%;
                background: #4caf50; margin-right: 5px; animation: blink 1.5s infinite; }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:.3} }
    .section-title { font-weight: 700; color: #1e6b3e; margin-bottom: 10px; font-size: 0.92rem; }
    .dayoff-tag { font-size: 0.7rem; color: #e65100; background: #fff3e0; border-radius: 4px;
                  padding: 1px 5px; margin-left: 4px; }
    #toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
             background: #333; color: white; padding: 10px 22px; border-radius: 22px;
             font-size: 0.88rem; opacity: 0; transition: opacity .3s; pointer-events: none; z-index: 99; }

    /* LINE 匯入 Modal */
    .line-modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,.5); z-index:100; overflow-y:auto; padding:20px; }
    .line-modal-body { max-width:480px; margin:20px auto; }
    .line-group-row { padding:10px 0; border-bottom:1px solid #f0f0f0; }
    .line-group-row:last-child { border-bottom:none; }
    .line-group-label { display:flex; align-items:center; gap:10px; cursor:pointer; font-weight:normal; margin-bottom:0; }
    .line-group-label input[type=checkbox] { width:18px; height:18px; accent-color:#1e6b3e; flex-shrink:0; }
    .btn-green { background:#1e6b3e; color:white; }

<body>

<header>
  <h1>🦪 五鮮級下單</h1>
  <div class="date-badge" id="headerDate">載入中…</div>
</header>

<div class="main">

  <!-- 填單區 -->
  <div class="card" id="formCard">
    <div>
      <label for="storeInput">門市名稱</label>
      <input type="text" id="storeInput" list="storeDatalist" placeholder="輸入關鍵字…" autocomplete="off">
      <datalist id="storeDatalist"></datalist>
      <button class="store-select-toggle" onclick="toggleStoreSelect()">或從列表選擇 ▾</button>
      <select class="store-select" id="storeSelect" onchange="storeSelectChanged()">
        <option value="">── 請選擇 ──</option>
      </select>
    </div>
    <div class="qty-wrap">
      <label>下單數量（包）</label>
      <div class="qty-row">
        <button class="qty-btn" onclick="adjustQty(-1)">−</button>
        <input type="number" id="qtyInput" value="1" min="1" max="99" inputmode="numeric">
        <button class="qty-btn" onclick="adjustQty(1)">+</button>
      </div>
    </div>
    <button class="btn-submit" id="submitBtn" onclick="submitOrder()">送出下單</button>
  </div>

  <!-- 送出成功 -->
  <div class="card success-card" id="successCard" style="display:none">
    <div class="success-icon">✅</div>
    <div class="success-title" id="successTitle">下單成功</div>
    <div class="success-sub" id="successSub"></div>
    <button class="btn-edit" onclick="resetForm()">修改 / 重新填寫</button>
  </div>

  <!-- 今日訂單 -->
  <div class="card">
    <div class="section-title">
      <span class="live-dot"></span>今日訂單
    </div>
    <div class="order-list" id="orderList">
      <div class="no-orders">尚無訂單</div>
    </div>
  </div>

  <!-- 未叫單 -->
  <div class="card">
    <div class="section-title" style="cursor:pointer;user-select:none" onclick="toggleMissing()">
      未叫單門市
      <span id="missingCount" style="font-weight:400;color:#aaa;font-size:0.88rem"></span>
      <span id="missingToggleIcon" style="float:right">▾</span>
    </div>
    <div class="order-list" id="missingList" style="display:none">
      <div class="no-orders">載入中…</div>
    </div>
  </div>

  <!-- 管理員 -->
  <div class="admin-toggle">
    <button class="btn-link" onclick="toggleAdmin()">管理員操作 ▾</button>
  </div>
  <div class="admin-panel card" id="adminPanel">
    <div class="date-set-row">
      <input type="date" id="adminDate">
      <button class="btn-sm btn-gray" onclick="changeDate()">切換日期</button>
    </div>
    <div class="admin-row">
      <button class="btn-sm btn-blue" onclick="exportExcel()">⬇ 下載 Excel</button>
      <button class="btn-sm btn-green" onclick="openLineModal()">📋 匯入 LINE</button>
      <button class="btn-sm btn-orange" onclick="clearDate()">🗑 清除此日</button>
    </div>
    <div id="saveStatus" style="margin-top:10px;font-size:0.82rem;color:#666;"></div>
  </div>

</div>

<!-- LINE 匯入 Modal -->
<div id="lineModal" class="line-modal-overlay" style="display:none">
  <div class="card line-modal-body">
    <div class="section-title" style="margin-bottom:10px">📋 LINE 訂單匯入</div>
    <textarea id="lineTextarea"
      placeholder="請貼上從 LINE 複製的訊息…"
      style="width:100%;height:150px;padding:12px;border:1.5px solid #ddd;border-radius:10px;font-size:0.88rem;font-family:inherit;resize:vertical;background:#fafafa;"
      oninput="onLineTextInput()"></textarea>
    <div id="lineModalSummary" style="font-size:0.88rem;color:#666;margin:10px 0 6px;min-height:1.2em"></div>
    <div id="lineModalGroups"></div>
    <div style="display:flex;gap:8px;margin-top:16px">
      <button class="btn-submit" id="lineImportBtn" onclick="confirmLineImport()" style="padding:14px" disabled>✓ 確認匯入</button>
      <button class="btn-sm btn-gray" onclick="closeLineModal()" style="padding:14px 20px;font-size:1rem">取消</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
// ── 門市資料 ──────────────────────────────────────────
// dayOff: 固定公休（僅顯示用，不影響下單）
// active: false → 已停業，不顯示在下拉選單
const STORES = [

  { r:"新竹", n:"環北店" },

  { r:"台中", n:"大里中興店", dayOff:"週二、三" },
  { r:"台中", n:"豐原店" },
  { r:"台中", n:"霧峰店" },

  { r:"南投", n:"埔里店" },
  { r:"南投", n:"草屯店" },

  { r:"彰化", n:"員林店" },
  { r:"彰化", n:"社頭店", dayOff:"週二、三" },
  { r:"彰化", n:"北斗店" },
  { r:"彰化", n:"溪湖店" },
  { r:"彰化", n:"和美店" },
  { r:"彰化", n:"中正店" },
  { r:"彰化", n:"鹿港店" },

  { r:"雲林", n:"斗六店" },
  { r:"雲林", n:"西螺店" },
  { r:"雲林", n:"北港店" },

  { r:"嘉義", n:"民族店" },
  { r:"嘉義", n:"水上店", dayOff:"週三、四" },
  { r:"嘉義", n:"大林店" },
  { r:"嘉義", n:"太保店", dayOff:"週一、二" },
  { r:"嘉義", n:"新港店", dayOff:"週二、三" },
  { r:"嘉義", n:"朴子店" },

  { r:"台南", n:"大灣店" },

  { r:"台南", n:"國平店" },
  // 北門店 5/11 起停業
  { r:"台南", n:"仁德店" },
  { r:"台南", n:"永康店" },
  { r:"台南", n:"東平店" },
  { r:"台南", n:"安南店" },

  { r:"高雄", n:"藍田店" },
  { r:"高雄", n:"寶陽店" },
  { r:"高雄", n:"岡山旗艦店" },
  { r:"高雄", n:"鼎力店" },

  { r:"高雄", n:"旗山店" },

  { r:"屏東", n:"東港店" },
  { r:"屏東", n:"潮州店" },
  { r:"屏東", n:"公園店" },
  { r:"屏東", n:"永大店" },
  { r:"屏東", n:"里港店" },

  { r:"燒甲", n:"燒甲佳里店" },
  { r:"燒甲", n:"燒甲陽明店",      dayOff:"週二、三" },
  { r:"燒甲", n:"燒甲嘉義民北店",  dayOff:"週二、三" },
];

// ── Firebase ──────────────────────────────────────────
const firebaseConfig = {
  apiKey: "AIzaSyBB9jPOLfJTBcW6bu1UL-KcF5SIaHhricA",
  authDomain: "hanbaoclam-2c65e.firebaseapp.com",
  projectId: "hanbaoclam-2c65e",
  storageBucket: "hanbaoclam-2c65e.firebasestorage.app",
  messagingSenderId: "155015616415",
  appId: "1:155015616415:web:b0e9988185778a00c20faa"
};
if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

// ── 狀態 ─────────────────────────────────────────────
let currentDate = "";       // YYYY-MM-DD，to 到貨日
let todayOrders = {};       // { storeName: qty }
let unsubscribe = null;
let _earlyOrders = {};      // { storeName: "YYYY-MM-DD" } 往後 7 天已叫
let _earlyOrdersReady = false;

// ── 初始化 ─────────────────────────────────────────────
window.onload = () => {
  // 預設明天
  const tomorrow = new Date();
  tomorrow.setDate(tomorrow.getDate() + 1);
  setDate(fmtDate(tomorrow));

  // datalist（文字輸入autocomplete）
  const dl = document.getElementById("storeDatalist");
  STORES.forEach(s => {
    const opt = document.createElement("option");
    opt.value = s.n;
    dl.appendChild(opt);
  });

  // 下拉選單（備用）
  const sel = document.getElementById("storeSelect");
  const regions = [...new Set(STORES.map(s => s.r))];
  regions.forEach(r => {
    const grp = document.createElement("optgroup");
    grp.label = r;
    STORES.filter(s => s.r === r).forEach(s => {
      const opt = document.createElement("option");
      opt.value = s.n;
      opt.textContent = s.n + (s.dayOff ? ` (休${s.dayOff})` : "");
      grp.appendChild(opt);
    });
    sel.appendChild(grp);
  });

  document.getElementById("storeInput").addEventListener("keydown", e => {
    if (e.key === "Enter") document.getElementById("qtyInput").focus();
  });
  document.getElementById("qtyInput").addEventListener("keydown", e => {
    if (e.key === "Enter") submitOrder();
  });
};

function fmtDate(d) {
  // Use local date components to avoid UTC timezone offset issues
  const y  = d.getFullYear();
  const m  = String(d.getMonth() + 1).padStart(2, '0');
  const dd = String(d.getDate()).padStart(2, '0');
  return `${y}-${m}-${dd}`;
}
function fmtDateCN(str) {
  if (!str) return "";
  const [y,m,d] = str.split("-");
  return `${y}年${parseInt(m)}月${parseInt(d)}日 到貨`;
}

const SHIP_DAYS = [2, 4, 6]; // 二、四、六出貨
const WEEKDAY_INDEX = { 日:0, 天:0, 一:1, 二:2, 三:3, 四:4, 五:5, 六:6 };

function getNextShipDateFromMessageDate(messageDate) {
  const d = new Date(messageDate + 'T00:00:00');
  for (let i = 0; i <= 7; i++) {
    const candidate = new Date(d);
    candidate.setDate(candidate.getDate() + i);
    if (SHIP_DAYS.includes(candidate.getDay())) return fmtDate(candidate);
  }
  return fmtDate(d);
}

function getShipDateBeforeArrival(arrivalDate) {
  const d = new Date(arrivalDate + 'T00:00:00');
  for (let i = 1; i <= 7; i++) {
    const candidate = new Date(d);
    candidate.setDate(candidate.getDate() - i);
    if (SHIP_DAYS.includes(candidate.getDay())) return fmtDate(candidate);
  }
  return fmtDate(d);
}

function getNextWeekdayDate(baseDate, targetDow) {
  const d = new Date(baseDate + 'T00:00:00');
  const diff = (targetDow - d.getDay() + 7) % 7 || 7;
  d.setDate(d.getDate() + diff);
  return fmtDate(d);
}

function parseArrivalDateFromMessage(content, messageDate) {
  const year = parseInt(messageDate.slice(0, 4), 10);
  const numeric = content.match(/(?:到貨|訂貨|交貨)日?[：:\s]*(\d{1,2})[\/.-](\d{1,2})/);
  if (numeric) {
    return `${year}-${numeric[1].padStart(2, '0')}-${numeric[2].padStart(2, '0')}`;
  }

  const weekday = content.match(/(?:週|星期|禮拜)([日天一二三四五六])\s*(?:到貨|送達|交貨)/);
  if (weekday) return getNextWeekdayDate(messageDate, WEEKDAY_INDEX[weekday[1]]);

  return "";
}

function getLineOrderShipDate(content, messageDate) {
  const arrivalDate = parseArrivalDateFromMessage(content, messageDate);
  if (arrivalDate) return getShipDateBeforeArrival(arrivalDate);
  return getNextShipDateFromMessageDate(messageDate);
}

function setDate(dateStr) {
  currentDate = dateStr;
  document.getElementById("headerDate").textContent = fmtDateCN(dateStr);
  document.getElementById("adminDate").value = dateStr;
  _earlyOrders = {};
  _earlyOrdersReady = false;
  listenOrders();
  loadEarlyOrders();
}

// ── 即時監聽訂單 ──────────────────────────────────────
function listenOrders() {
  if (unsubscribe) unsubscribe();
  if (!currentDate) return;
  const docId = `五鮮級_${currentDate}`;
  unsubscribe = db.collection("orders_wuxian").doc(docId).onSnapshot(snap => {
    todayOrders = (snap.exists && snap.data().stores) ? snap.data().stores : {};
    renderOrderList();
  });
}

// ── 下拉備用切換 ─────────────────────────────────────
function toggleStoreSelect() {
  document.getElementById("storeSelect").classList.toggle("show");
}
function storeSelectChanged() {
  const v = document.getElementById("storeSelect").value;
  if (v) document.getElementById("storeInput").value = v;
}

// ── 送出下單 ──────────────────────────────────────────
async function submitOrder() {
  const store = document.getElementById("storeInput").value.trim()
             || document.getElementById("storeSelect").value;
  const qty   = parseInt(document.getElementById("qtyInput").value) || 0;
  if (!store) { toast("請輸入門市名稱"); return; }
  if (qty < 1) { toast("請輸入包數"); return; }

  const btn = document.getElementById("submitBtn");
  btn.disabled = true;
  btn.textContent = "送出中…";

  const docId = `五鮮級_${currentDate}`;
  try {
    await db.collection("orders_wuxian").doc(docId).set(
      { stores: { [store]: qty }, date: currentDate, updatedAt: new Date().toISOString() },
      { merge: true }
    );
    // 顯示成功
    document.getElementById("formCard").style.display = "none";
    document.getElementById("successCard").style.display = "block";
    document.getElementById("successTitle").textContent = `${store} 下單成功`;
    const box = calcBox(qty);
    document.getElementById("successSub").textContent =
      `${qty} 包 (${qty*5} 斤）｜${box.count}${box.type} 箱`;
  } catch(e) {
    toast("送出失敗：" + e.message);
    btn.disabled = false;
    btn.textContent = "送出下單";
  }
}

function resetForm() {
  document.getElementById("formCard").style.display = "block";
  document.getElementById("successCard").style.display = "none";
  document.getElementById("submitBtn").disabled = false;
  document.getElementById("submitBtn").textContent = "送出下單";
  document.getElementById("storeInput").value = "";
  document.getElementById("storeSelect").value = "";
  document.getElementById("qtyInput").value = 1;
  document.getElementById("storeInput").focus();
}

// ── 數量±按鈕 ─────────────────────────────────────────
function adjustQty(delta) {
  const el = document.getElementById("qtyInput");
  const v = (parseInt(el.value) || 0) + delta;
  el.value = Math.max(1, Math.min(99, v));
}

// ── 計算箱型 ─────────────────────────────────────────
function calcBox(qty) {
  if (qty <= 2) return { type: "D", count: 1 };
  return { type: "C", count: Math.ceil(qty / 7) };
}

// ── 渲染訂單列表 ──────────────────────────────────────
function renderOrderList() {
  const box = document.getElementById("orderList");
  const knownNames = new Set(STORES.map(s => s.n));

  // 照 STORES 順序排，再接不在清單的
  const entries = STORES
    .filter(s => todayOrders[s.n] > 0)
    .map(s => ({ n: s.n, qty: todayOrders[s.n] }));
  Object.keys(todayOrders).forEach(name => {
    if (!knownNames.has(name) && todayOrders[name] > 0)
      entries.push({ n: name, qty: todayOrders[name] });
  });

  if (!entries.length) {
    box.innerHTML = '<div class="no-orders">尚無訂單</div>';
    renderMissingList();
    return;
  }

  const totalPkg = entries.reduce((s, e) => s + e.qty, 0);
  box.innerHTML = entries.map(e =>
    `<div class="order-item">
      <span class="order-name">${e.n}</span>
      <span class="order-qty">${e.qty} 包</span>
    </div>`
  ).join("") + `<div class="order-total">
    <span>共 ${entries.length} 家</span>
    <span>${totalPkg} 包</span>
  </div>`;
  renderMissingList();
}

// ── 管理員 ────────────────────────────────────────────
function toggleAdmin() {
  const panel = document.getElementById("adminPanel");
  panel.classList.toggle("open");
}

function changeDate() {
  const d = document.getElementById("adminDate").value;
  if (!d) return;
  setDate(d);
  toast(`切換到 ${fmtDateCN(d)}`);
}

function clearDate() {
  if (!confirm(`確定清除 ${currentDate} 所有訂單？`)) return;
  const docId = `五鮮級_${currentDate}`;
  db.collection("orders_wuxian").doc(docId).delete()
    .then(() => toast("已清除"))
    .catch(e => toast("失敗：" + e.message));
}

// ── 匯出 Excel ────────────────────────────────────────
function exportExcel() {
  const wb = XLSX.utils.book_new();

  // Sheet 1：出貨明細
  const header = ["區域", "門市", "下單量(包)", "總斤數", "箱型", "箱數"];
  const rows = [header];
  const regions = [...new Set(STORES.map(s => s.r))];
  let totalPkg = 0;
  regions.forEach(r => {
    STORES.filter(s => s.r === r && todayOrders[s.n] > 0).forEach(s => {
      const qty = todayOrders[s.n];
      const b = calcBox(qty);
      rows.push([r, s.n, qty, qty*5, b.type, b.count]);
      totalPkg += qty;
    });
  });
  // 不在 STORES 的
  const knownNames = new Set(STORES.map(s => s.n));
  Object.keys(todayOrders).forEach(name => {
    if (!knownNames.has(name) && todayOrders[name] > 0) {
      const qty = todayOrders[name];
      const b = calcBox(qty);
      rows.push(["其他", name, qty, qty*5, b.type, b.count]);
      totalPkg += qty;
    }
  });
  rows.push(["", "合計", totalPkg, totalPkg*5, "", ""]);

  const ws = XLSX.utils.aoa_to_sheet(rows);
  ws["!cols"] = [{wch:6},{wch:14},{wch:12},{wch:10},{wch:6},{wch:6}];
  XLSX.utils.book_append_sheet(wb, ws, currentDate.replace(/-/g,""));

  // Sheet 2：未下單門市
  const notOrdered = STORES.filter(s => !todayOrders[s.n]);
  if (notOrdered.length) {
    const ws2 = XLSX.utils.aoa_to_sheet([
      ["區域","門市"],
      ...notOrdered.map(s => [s.r, s.n])
    ]);
    ws2["!cols"] = [{wch:6},{wch:14}];
    XLSX.utils.book_append_sheet(wb, ws2, "未下單");
  }

  XLSX.writeFile(wb, `五鮮級_${currentDate}.xlsx`);
  toast("✓ Excel 已下載");
}

// ── LINE 匯入 ──────────────────────────────────────────
let _lineImportData = null;
let _lineDebounce  = null;

function openLineModal() {
  document.getElementById('lineTextarea').value = '';
  document.getElementById('lineModalSummary').textContent = '';
  document.getElementById('lineModalGroups').innerHTML = '';
  document.getElementById('lineImportBtn').disabled = true;
  _lineImportData = null;
  document.getElementById('lineModal').style.display = 'block';
  setTimeout(() => document.getElementById('lineTextarea').focus(), 50);
}

function onLineTextInput() {
  clearTimeout(_lineDebounce);
  _lineDebounce = setTimeout(() => {
    const text = document.getElementById('lineTextarea').value;
    if (!text.trim()) {
      document.getElementById('lineModalSummary').textContent = '';
      document.getElementById('lineModalGroups').innerHTML = '';
      document.getElementById('lineImportBtn').disabled = true;
      _lineImportData = null;
      return;
    }
    try {
      _lineImportData = parseLineText(text);
      showLineModal(_lineImportData);
    } catch(err) {
      toast('解析失敗：' + err.message);
    }
  }, 300);
}

function parseLineText(text) {
  const lines = text.split('\n');
  const timeRe = /^\d{1,2}:\d{2}\s/;
  // Date markers like "2026.05.19 星期二" — mark when the calendar date changes
  const dateMarkerRe = /^(\d{4})\.(\d{2})\.(\d{2})\s+星期/;

  // First pass: find all date markers and their line positions
  const dateMarkers = []; // [{ lineIndex, date: "YYYY-MM-DD" }]
  for (let i = 0; i < lines.length; i++) {
    const m = dateMarkerRe.exec(lines[i].trim());
    if (m) dateMarkers.push({ lineIndex: i, date: `${m[1]}-${m[2]}-${m[3]}` });
  }

  // Messages before the first marker belong to the previous calendar day
  let startDate;
  if (dateMarkers.length > 0) {
    const d = new Date(dateMarkers[0].date + 'T00:00:00');
    d.setDate(d.getDate() - 1);
    startDate = fmtDate(d);
  } else {
    startDate = fmtDate(new Date());
  }

  // Second pass: collect messages tagged with the date they were sent
  let currentDate = startDate;
  let markerPtr = 0;
  const msgs = []; // [{ date, content }]
  let cur = null;

  for (let i = 0; i < lines.length; i++) {
    // Advance through any date markers at this line
    if (markerPtr < dateMarkers.length && dateMarkers[markerPtr].lineIndex === i) {
      if (cur !== null) { msgs.push({ date: currentDate, content: cur }); cur = null; }
      currentDate = dateMarkers[markerPtr].date;
      markerPtr++;
      continue;
    }
    const trimmed = lines[i].trimEnd();
    if (timeRe.test(trimmed)) {
      if (cur !== null) msgs.push({ date: currentDate, content: cur });
      cur = trimmed.replace(/^\d{1,2}:\d{2}\s+/, '');
    } else if (cur !== null) {
      cur += '\n' + trimmed;
    }
  }
  if (cur !== null) msgs.push({ date: currentDate, content: cur });

  // Group by the LINE message date; if the body says an arrival day, convert it back to a Tue/Thu/Sat ship date.
  const byDate = {}; // { "YYYY-MM-DD": { orders: [{store,qty,shipDate}], noOrders: [] } }

  for (const { date, content } of msgs) {
    if (!content.trim()) continue;
    if (content.includes('已收回訊息')) continue;
    if (content.includes('加入聊天')) continue;

    if (!byDate[date]) byDate[date] = { orders: [], noOrders: [] };

    const storeM = content.match(/店　名[：:]\s*(.+)/);
    const qtyM   = content.match(/\(包\)\s*[：:]\s*(\d+)/);

    if (storeM && qtyM) {
      const store = storeM[1].trim();
      const qty   = parseInt(qtyM[1], 10);
      const shipDate = getLineOrderShipDate(content, date);
      byDate[date].orders.push({ store, qty, shipDate });
    } else if (/無需叫貨|不叫貨|無需訂貨|今日無需/.test(content)) {
      byDate[date].noOrders.push(content.trim());
    }
  }

  return byDate; // { "YYYY-MM-DD": { orders, noOrders } }
}

const _DOW = ['日','一','二','三','四','五','六'];
function _dateLabelCN(dateStr) {
  const d = new Date(dateStr + 'T00:00:00');
  return `${parseInt(dateStr.slice(5,7))}/${parseInt(dateStr.slice(8,10))}（${_DOW[d.getDay()]}）`;
}

function showLineModal(byDate) {
  const dates = Object.keys(byDate).sort();
  const totalOrders   = dates.reduce((s, d) => s + byDate[d].orders.length,   0);
  const totalNoOrders = dates.reduce((s, d) => s + byDate[d].noOrders.length, 0);

  document.getElementById('lineModalSummary').textContent =
    `共找到 ${dates.length} 個下單日、${totalOrders} 筆訂單、${totalNoOrders} 筆無需叫貨`;

  const groupsHtml = dates.length ? dates.map(dateStr => {
    const { orders, noOrders } = byDate[dateStr];
    // Group by computed ship date from the LINE message date.
    const byShip = {};
    orders.forEach(o => { byShip[o.shipDate] = (byShip[o.shipDate] || 0) + 1; });
    const shipKeys = Object.keys(byShip).sort();
    const shipSummary = shipKeys.map(d =>
      `<span style="background:#e8f5e9;border-radius:4px;padding:1px 6px;margin-right:4px">出貨 ${parseInt(d.slice(5,7))}/${parseInt(d.slice(8,10))} ${byShip[d]}筆</span>`
    ).join('');

    return `<div class="line-group-row">
      <label class="line-group-label">
        <input type="checkbox" checked value="${dateStr}">
        <span style="width:100%">
          <strong>下單日 ${_dateLabelCN(dateStr)}</strong>
          <span style="color:#666;font-size:0.88rem">｜${orders.length} 筆、${noOrders.length} 筆無需</span>
          <br><span style="font-size:0.78rem;line-height:1.8">${shipSummary}</span>
        </span>
      </label>
    </div>`;
  }).join('') : '<div style="color:#bbb;text-align:center;padding:20px">未找到任何訂單</div>';

  document.getElementById('lineModalGroups').innerHTML = groupsHtml;
  document.getElementById('lineImportBtn').disabled = !dates.length;
}

function closeLineModal() {
  document.getElementById('lineModal').style.display = 'none';
  document.getElementById('lineTextarea').value = '';
  _lineImportData = null;
}

async function confirmLineImport() {
  const checks = document.querySelectorAll('#lineModalGroups input[type=checkbox]:checked');
  if (!checks.length) { toast('請勾選要匯入的下單日'); return; }

  // Collect all orders keyed by ship date computed from the LINE message date.
  const byShipDate = {}; // { "YYYY-MM-DD": { storeName: qty } }
  for (const cb of checks) {
    const { orders } = _lineImportData[cb.value] || {};
    if (!orders) continue;
    orders.forEach(o => {
      if (!byShipDate[o.shipDate]) byShipDate[o.shipDate] = {};
      byShipDate[o.shipDate][o.store] = (byShipDate[o.shipDate][o.store] || 0) + o.qty;
    });
  }

  const shipDates = Object.keys(byShipDate).sort();
  for (const dateStr of shipDates) {
    const stores = byShipDate[dateStr];
    await db.collection('orders_wuxian').doc(`五鮮級_${dateStr}`).set(
      { stores, date: dateStr, updatedAt: new Date().toISOString() },
      { merge: true }
    );
  }

  closeLineModal();
  toast(`✓ 已存入 ${shipDates.length} 個出貨日`);
  setDate(shipDates[0]);
}

// ── 未叫單 ────────────────────────────────────────────
let _missingOpen = false;

function toggleMissing() {
  _missingOpen = !_missingOpen;
  document.getElementById('missingList').style.display = _missingOpen ? 'block' : 'none';
  document.getElementById('missingToggleIcon').textContent = _missingOpen ? '▴' : '▾';
  if (_missingOpen) renderMissingList();
}

function renderMissingList() {
  const countEl = document.getElementById('missingCount');
  const listEl  = document.getElementById('missingList');
  const ordered = new Set(Object.keys(todayOrders).filter(k => todayOrders[k] > 0));
  const missing = STORES.filter(s => !ordered.has(s.n));

  countEl.textContent = missing.length ? `（${missing.length} 家）` : '';

  if (!_missingOpen) return;

  if (!missing.length) {
    listEl.innerHTML = '<div class="no-orders">所有門市今日已叫貨 ✓</div>';
    return;
  }

  listEl.innerHTML = missing.map(s => {
    let badge = '';
    if (_earlyOrdersReady && _earlyOrders[s.n]) {
      const dd = _earlyOrders[s.n];
      const label = `${parseInt(dd.slice(5,7))}/${parseInt(dd.slice(8,10))}`;
      badge = `<span style="color:#2e7d32;font-size:0.78rem;margin-left:4px">✓ 已提前叫貨（出貨 ${label}）</span>`;
    } else if (s.dayOff) {
      badge = `<span class="dayoff-tag">${s.dayOff} 公休</span>`;
    }
    const isEarly = _earlyOrdersReady && _earlyOrders[s.n];
    return `<div class="order-item">
      <span class="order-name">${s.n}${badge}</span>
      <span style="color:${isEarly ? '#2e7d32' : '#ddd'};font-size:0.82rem">${isEarly ? '✓' : '未叫'}</span>
    </div>`;
  }).join('');
}

async function loadEarlyOrders() {
  _earlyOrders = {};
  _earlyOrdersReady = false;
  const base = new Date(currentDate + 'T00:00:00');
  const reads = [];
  for (let i = 1; i <= 7; i++) {
    const d = new Date(base);
    d.setDate(d.getDate() + i);
    const dateStr = fmtDate(d);
    reads.push(
      db.collection('orders_wuxian').doc(`五鮮級_${dateStr}`).get().then(snap => {
        if (snap.exists && snap.data().stores)
          Object.keys(snap.data().stores).forEach(name => {
            if (!_earlyOrders[name]) _earlyOrders[name] = dateStr;
          });
      })
    );
  }
  await Promise.all(reads);
  _earlyOrdersReady = true;
  renderMissingList();
}

// ── Toast ─────────────────────────────────────────────
let _toastTimer;
function toast(msg) {
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.style.opacity = 1;
  clearTimeout(_toastTimer);
  _toastTimer = setTimeout(() => el.style.opacity = 0, 2400);
}
