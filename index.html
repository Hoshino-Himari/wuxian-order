function fmtDate(d) {
  // Use local date components to avoid UTC timezone offset issues
  const y  = d.getFullYear();
  const m  = String(d.getMonth() + 1).padStart(2, '0');
  const dd = String(d.getDate()).padStart(2, '0');
  return `${y}-${m}-${dd}`;
}
function fmtDateCN(str) {
  if (!str) return "";
  const [y,m,d] = str.split("-");
  return `${y}年${parseInt(m)}月${parseInt(d)}日 出貨`;
}

const SHIP_DAYS = [2, 4, 6]; // 二、四、六出貨
const WEEKDAY_INDEX = { 日:0, 天:0, 一:1, 二:2, 三:3, 四:4, 五:5, 六:6 };

function getNextShipDateFromMessageDate(messageDate) {
  const d = new Date(messageDate + 'T00:00:00');
  for (let i = 0; i <= 7; i++) {
    const candidate = new Date(d);
    candidate.setDate(candidate.getDate() + i);
    if (SHIP_DAYS.includes(candidate.getDay())) return fmtDate(candidate);
  }
  return fmtDate(d);
}

function getNextShipDateAfter(dateStr) {
  const d = new Date(dateStr + 'T00:00:00');
  d.setDate(d.getDate() + 1);
  for (let i = 0; i <= 7; i++) {
    const candidate = new Date(d);
    candidate.setDate(candidate.getDate() + i);
    if (SHIP_DAYS.includes(candidate.getDay())) return fmtDate(candidate);
  }
  return dateStr;
}

function getShipDateBeforeArrival(arrivalDate) {
  const d = new Date(arrivalDate + 'T00:00:00');
  for (let i = 1; i <= 7; i++) {
    const candidate = new Date(d);
    candidate.setDate(candidate.getDate() - i);
    if (SHIP_DAYS.includes(candidate.getDay())) return fmtDate(candidate);
  }
  return fmtDate(d);
}

function getNextWeekdayDate(baseDate, targetDow) {
  const d = new Date(baseDate + 'T00:00:00');
  const diff = (targetDow - d.getDay() + 7) % 7 || 7;
  d.setDate(d.getDate() + diff);
  return fmtDate(d);
}

function parseArrivalWeekdayFromMessage(content, messageDate) {
  const weekday = content.match(/(?:週|星期|禮拜)([日天一二三四五六])\s*(?:到貨|送達|交貨|到)/);
  if (weekday) return getNextWeekdayDate(messageDate, WEEKDAY_INDEX[weekday[1]]);
  return "";
}

function parseArrivalDateFromMessage(content, baseDate) {
  const year = parseInt(baseDate.slice(0, 4), 10);
  const numeric = content.match(/(?:到貨|訂貨|交貨)日?[：:\s]*(\d{1,2})[\/.-](\d{1,2})/);
  if (numeric) {
    return `${year}-${numeric[1].padStart(2, '0')}-${numeric[2].padStart(2, '0')}`;
  }

  return parseArrivalWeekdayFromMessage(content, baseDate);
}

function getLineOrderShipDate(content, defaultShipDate, fallbackContent = "") {
  const text = `${content}\n${fallbackContent}`;
  return /提早|提前|店休|公休/.test(text) ? getNextShipDateAfter(defaultShipDate) : defaultShipDate;
}

function shouldMoveToNextShipDate(store, defaultShipDate, content, fallbackContent = "") {
  const text = `${content}\n${fallbackContent}`;
  if (/提早|提前|店休|公休/.test(text)) return true;
  const info = STORE_BY_NAME[store];
  if (!info || !info.dayOff || !/到貨日|頻率|隔週/.test(text)) return false;
  const arrival = new Date(defaultShipDate + 'T00:00:00');
  arrival.setDate(arrival.getDate() + 1);
  return info.dayOff.includes(_DOW[arrival.getDay()]);
}

function normalizeStoreName(raw) {
  let name = (raw || '').trim();
  name = name.replace(/^[@＠][^\s]+[\s-]*/, '').trim();
  if (STORE_ALIASES[name]) return STORE_ALIASES[name];
  if (STORE_BY_NAME[name]) return name;
  const compactName = name.replace(/\s+/g, '');
  if (STORE_ALIASES[compactName]) return STORE_ALIASES[compactName];
  if (STORE_BY_NAME[compactName]) return compactName;
  name = name.replace(/^(五鮮級|燒甲五春|燒甲)[\s-]*/, '').trim();
  name = name.replace(/^[-－–—]+/, '').trim();
  name = name.split(/\s+/)[0];
  name = name.replace(/[，,。．.：:；;、\s]+$/g, '').trim();
  if (STORE_ALIASES[name]) return STORE_ALIASES[name];
  if (STORE_BY_NAME[name]) return name;
  return name;
}

function normalizeOrderStores(stores) {
  const normalized = {};
  Object.entries(stores || {}).forEach(([name, qty]) => {
    const storeName = normalizeStoreName(name);
    const amount = parseInt(qty, 10) || 0;
    normalized[storeName] = (normalized[storeName] || 0) + amount;
  });
  return normalized;
}

function normalizeNoOrderStores(noOrders) {
  const normalized = {};
  if (Array.isArray(noOrders)) {
    noOrders.forEach(name => { normalized[normalizeStoreName(name)] = true; });
  } else {
    Object.keys(noOrders || {}).forEach(name => { normalized[normalizeStoreName(name)] = true; });
  }
  return normalized;
}

function extractLineOrderBlocks(content) {
  const matches = [...content.matchAll(/店[\s　]*名[：:]\s*([^\n\r]+)/g)];
  return matches.map((match, idx) => {
    const next = matches[idx + 1];
    return content.slice(match.index, next ? next.index : content.length).trim();
  });
}

function extractStoresFromText(content) {
  const found = new Set();
  const occupied = [];
  const addIfFree = (label, store) => {
    if (!label) return;
    let start = content.indexOf(label);
    while (start >= 0) {
      const end = start + label.length;
      const overlaps = occupied.some(range => start < range.end && end > range.start);
      if (!overlaps) {
        occupied.push({ start, end });
        found.add(store);
        return;
      }
      start = content.indexOf(label, start + 1);
    }
  };

  for (const match of content.matchAll(/店[\s　]*名[：:]\s*([^\n\r]+)/g)) {
    found.add(normalizeStoreName(match[1]));
  }

  const candidates = [
    ...Object.entries(STORE_ALIASES).map(([alias, store]) => ({ label: alias, store })),
    ...STORES.map(s => ({ label: s.n, store: s.n }))
  ].sort((a, b) => b.label.length - a.label.length);

  candidates.forEach(({ label, store }) => addIfFree(label, store));
  return [...found];
}

function escHtml(str) {
  return String(str).replace(/[&<>"']/g, c => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[c]));
}

function setDate(dateStr) {
  currentDate = dateStr;
  document.getElementById("headerDate").textContent = fmtDateCN(dateStr);
  document.getElementById("adminDate").value = dateStr;
  _earlyOrders = {};
  _earlyOrdersReady = false;
  todayNoOrders = {};
  listenOrders();
  loadEarlyOrders();
}

// ── 即時監聽訂單 ──────────────────────────────────────
function listenOrders() {
  if (unsubscribe) unsubscribe();
  if (!currentDate) return;
  const docId = `五鮮級_${currentDate}`;
  unsubscribe = db.collection("orders_wuxian").doc(docId).onSnapshot(snap => {
    const data = snap.exists ? snap.data() : {};
    todayOrders = data.stores ? normalizeOrderStores(data.stores) : {};
    todayNoOrders = data.noOrders ? normalizeNoOrderStores(data.noOrders) : {};
    renderOrderList();
  });
}

// ── 下拉備用切換 ─────────────────────────────────────
function toggleStoreSelect() {
  document.getElementById("storeSelect").classList.toggle("show");
}
function storeSelectChanged() {
  const v = document.getElementById("storeSelect").value;
  if (v) document.getElementById("storeInput").value = v;
}

// ── 送出下單 ──────────────────────────────────────────
async function submitOrder() {
  const store = normalizeStoreName(document.getElementById("storeInput").value.trim()
             || document.getElementById("storeSelect").value);
  const qty   = parseInt(document.getElementById("qtyInput").value) || 0;
  if (!store) { toast("請輸入門市名稱"); return; }
  if (qty < 1) { toast("請輸入包數"); return; }

  const btn = document.getElementById("submitBtn");
  btn.disabled = true;
  btn.textContent = "送出中…";

  const docId = `五鮮級_${currentDate}`;
  try {
    await db.collection("orders_wuxian").doc(docId).set(
      { stores: { [store]: qty }, date: currentDate, updatedAt: new Date().toISOString() },
      { merge: true }
    );
    // 顯示成功
    document.getElementById("formCard").style.display = "none";
    document.getElementById("successCard").style.display = "block";
    document.getElementById("successTitle").textContent = `${store} 下單成功`;
    const box = calcBox(qty);
    document.getElementById("successSub").textContent =
      `${qty} 包 (${qty*5} 斤）｜${box.count}${box.type} 箱`;
  } catch(e) {
    toast("送出失敗：" + e.message);
    btn.disabled = false;
    btn.textContent = "送出下單";
  }
}

function resetForm() {
  document.getElementById("formCard").style.display = "block";
  document.getElementById("successCard").style.display = "none";
  document.getElementById("submitBtn").disabled = false;
  document.getElementById("submitBtn").textContent = "送出下單";
  document.getElementById("storeInput").value = "";
  document.getElementById("storeSelect").value = "";
  document.getElementById("qtyInput").value = 1;
  document.getElementById("storeInput").focus();
}

// ── 數量±按鈕 ─────────────────────────────────────────
function adjustQty(delta) {
  const el = document.getElementById("qtyInput");
  const v = (parseInt(el.value) || 0) + delta;
  el.value = Math.max(1, Math.min(99, v));
}

// ── 計算箱型 ─────────────────────────────────────────
function calcBox(qty) {
  if (qty <= 2) return { type: "D", count: 1 };
  return { type: "C", count: Math.ceil(qty / 7) };
}

// ── 渲染訂單列表 ──────────────────────────────────────
function renderOrderList() {
  const box = document.getElementById("orderList");
  const knownNames = new Set(STORES.map(s => s.n));

  // 照 STORES 順序排，再接不在清單的
  const entries = STORES
    .filter(s => todayOrders[s.n] > 0)
    .map(s => ({ n: s.n, qty: todayOrders[s.n] }));
  Object.keys(todayOrders).forEach(name => {
    if (!knownNames.has(name) && todayOrders[name] > 0)
      entries.push({ n: name, qty: todayOrders[name] });
  });

  if (!entries.length) {
    box.innerHTML = '<div class="no-orders">尚無訂單</div>';
    renderMissingList();
    return;
  }

  const totalPkg = entries.reduce((s, e) => s + e.qty, 0);
  box.innerHTML = entries.map(e =>
    `<div class="order-item">
      <span class="order-name">${e.n}</span>
      <span class="order-qty">${e.qty} 包</span>
    </div>`
  ).join("") + `<div class="order-total">
    <span>共 ${entries.length} 家</span>
    <span>${totalPkg} 包｜${totalPkg * 5} 斤</span>
  </div>`;
  renderMissingList();
}

// ── 管理員 ────────────────────────────────────────────
function toggleAdmin() {
  const panel = document.getElementById("adminPanel");
  panel.classList.toggle("open");
}

function changeDate() {
  const d = document.getElementById("adminDate").value;
  if (!d) return;
  setDate(d);
  toast(`切換到 ${fmtDateCN(d)}`);
}

function clearDate() {
  if (!confirm(`確定清除 ${currentDate} 所有訂單？`)) return;
  const docId = `五鮮級_${currentDate}`;
  db.collection("orders_wuxian").doc(docId).delete()
    .then(() => toast("已清除"))
    .catch(e => toast("失敗：" + e.message));
}

// ── 匯出 Excel ────────────────────────────────────────
function exportExcel() {
  const wb = XLSX.utils.book_new();

  // Sheet 1：出貨明細
  const header = ["區域", "門市", "下單量(包)", "總斤數", "箱型", "箱數"];
  const rows = [header];
  const regions = [...new Set(STORES.map(s => s.r))];
  let totalPkg = 0;
  regions.forEach(r => {
    STORES.filter(s => s.r === r && todayOrders[s.n] > 0).forEach(s => {
      const qty = todayOrders[s.n];
      const b = calcBox(qty);
      rows.push([r, s.n, qty, qty*5, b.type, b.count]);
      totalPkg += qty;
    });
  });
  // 不在 STORES 的
  const knownNames = new Set(STORES.map(s => s.n));
  Object.keys(todayOrders).forEach(name => {
    if (!knownNames.has(name) && todayOrders[name] > 0) {
      const qty = todayOrders[name];
      const b = calcBox(qty);
      rows.push(["其他", name, qty, qty*5, b.type, b.count]);
      totalPkg += qty;
    }
  });
  rows.push(["", "合計", totalPkg, totalPkg*5, "", ""]);

  const ws = XLSX.utils.aoa_to_sheet(rows);
  ws["!cols"] = [{wch:6},{wch:14},{wch:12},{wch:10},{wch:6},{wch:6}];
  XLSX.utils.book_append_sheet(wb, ws, currentDate.replace(/-/g,""));

  // Sheet 2：未下單門市
  const notOrdered = STORES.filter(s => !todayOrders[s.n]);
  if (notOrdered.length) {
    const ws2 = XLSX.utils.aoa_to_sheet([
      ["區域","門市"],
      ...notOrdered.map(s => [s.r, s.n])
    ]);
    ws2["!cols"] = [{wch:6},{wch:14}];
    XLSX.utils.book_append_sheet(wb, ws2, "未下單");
  }

  XLSX.writeFile(wb, `五鮮級_${currentDate}.xlsx`);
  toast("✓ Excel 已下載");
}

// ── LINE 匯入 ──────────────────────────────────────────
let _lineImportData = null;
let _lineDebounce  = null;

function openLineModal() {
  document.getElementById('lineTextarea').value = '';
  document.getElementById('lineModalSummary').textContent = '';
  document.getElementById('lineModalGroups').innerHTML = '';
  document.getElementById('lineImportBtn').disabled = true;
  _lineImportData = null;
  document.getElementById('lineModal').style.display = 'block';
  setTimeout(() => document.getElementById('lineTextarea').focus(), 50);
}

function onLineTextInput() {
  clearTimeout(_lineDebounce);
  _lineDebounce = setTimeout(() => {
    const text = document.getElementById('lineTextarea').value;
    if (!text.trim()) {
      document.getElementById('lineModalSummary').textContent = '';
      document.getElementById('lineModalGroups').innerHTML = '';
      document.getElementById('lineImportBtn').disabled = true;
      _lineImportData = null;
      return;
    }
    try {
      _lineImportData = parseLineText(text);
      showLineModal(_lineImportData);
    } catch(err) {
      toast('解析失敗：' + err.message);
    }
  }, 300);
}

function parseLineText(text) {
  const lines = text.split('\n');
  const timeRe = /^\d{1,2}:\d{2}\s/;
  const dateMarkerRe = /^\d{4}\.\d{2}\.\d{2}(?:\s|$)/;
  const defaultShipDate = currentDate || fmtDate(new Date());
  const msgs = [];
  let cur = null;

  for (const raw of lines) {
    const trimmed = raw.trimEnd();
    if (!trimmed.trim() || dateMarkerRe.test(trimmed.trim())) continue;
    if (timeRe.test(trimmed)) {
      if (cur !== null) msgs.push(cur);
      cur = trimmed.replace(/^\d{1,2}:\d{2}\s+/, '');
    } else if (cur !== null) {
      cur += '\n' + trimmed;
    } else {
      cur = trimmed;
    }
  }
  if (cur !== null) msgs.push(cur);

  const byShipDate = {}; // { "YYYY-MM-DD": { orders: [{store,qty,shipDate,isEarly}], noOrders: [storeName] } }

  for (const content of msgs) {
    if (!content.trim()) continue;
    if (content.includes('已收回訊息')) continue;
    if (content.includes('加入聊天')) continue;

    const orderBlocks = extractLineOrderBlocks(content);
    if (orderBlocks.length) {
      orderBlocks.forEach(block => {
        const storeM = block.match(/店[\s　]*名[：:]\s*([^\n\r]+)/);
        const qtyM   = block.match(/\(包\)\s*[：:]\s*(\d+)/);
        if (!storeM) return;
        const store = normalizeStoreName(storeM[1]);
        if (/無需叫貨|不叫貨|無需訂貨|今日無需|不用叫|不用訂/.test(block) && !qtyM) {
          if (!byShipDate[defaultShipDate]) byShipDate[defaultShipDate] = { orders: [], noOrders: [] };
          if (!byShipDate[defaultShipDate].noOrders.includes(store)) byShipDate[defaultShipDate].noOrders.push(store);
          return;
        }
        if (!qtyM) return;
        const qty   = parseInt(qtyM[1], 10);
        const shipDate = shouldMoveToNextShipDate(store, defaultShipDate, block, content)
          ? getNextShipDateAfter(defaultShipDate)
          : defaultShipDate;
        if (!byShipDate[shipDate]) byShipDate[shipDate] = { orders: [], noOrders: [] };
        byShipDate[shipDate].orders.push({ store, qty, shipDate, isEarly: shipDate !== defaultShipDate });
      });
    } else if (/無需叫貨|不叫貨|無需訂貨|今日無需/.test(content)) {
      if (!byShipDate[defaultShipDate]) byShipDate[defaultShipDate] = { orders: [], noOrders: [] };
      extractStoresFromText(content).forEach(store => {
        if (!byShipDate[defaultShipDate].noOrders.includes(store)) byShipDate[defaultShipDate].noOrders.push(store);
      });
    }
  }

  return byShipDate;
}

const _DOW = ['日','一','二','三','四','五','六'];
function _dateLabelCN(dateStr) {
  const d = new Date(dateStr + 'T00:00:00');
  return `${parseInt(dateStr.slice(5,7))}/${parseInt(dateStr.slice(8,10))}（${_DOW[d.getDay()]}）`;
}

function showLineModal(byShipDate) {
  const dates = Object.keys(byShipDate).sort();
  const totalOrders   = dates.reduce((s, d) => s + byShipDate[d].orders.length,   0);
  const totalNoOrders = dates.reduce((s, d) => s + byShipDate[d].noOrders.length, 0);
  const movedOrders   = dates.reduce((s, d) => s + byShipDate[d].orders.filter(o => o.isEarly).length, 0);

  document.getElementById('lineModalSummary').textContent =
    `共 ${totalOrders} 筆訂單、${totalNoOrders} 筆無需叫貨${movedOrders ? `、${movedOrders} 筆移到其他出貨日` : ''}`;

  const groupsHtml = dates.length ? dates.map(dateStr => {
    const { orders, noOrders } = byShipDate[dateStr];
    const early = orders.filter(o => o.isEarly).length;
    const totalQty = orders.reduce((s, o) => s + o.qty, 0);
    const orderDetail = orders.slice(0, 4).map(o =>
      `<span style="background:${o.isEarly ? '#fff3e0' : '#e8f5e9'};border-radius:4px;padding:1px 6px;margin-right:4px">${escHtml(o.store)} ${o.qty}包${o.isEarly ? ' 已移至此日' : ''}</span>`
    ).join('');
    const noOrderDetail = noOrders.slice(0, 4).map(store =>
      `<span style="background:#e3f2fd;border-radius:4px;padding:1px 6px;margin-right:4px">${escHtml(store)} 無需</span>`
    ).join('');
    const detail = orderDetail + noOrderDetail;

    return `<div class="line-group-row">
      <label class="line-group-label">
        <input type="checkbox" checked value="${dateStr}">
        <span style="width:100%">
          <strong>出貨日 ${_dateLabelCN(dateStr)}</strong>
          <span style="color:#666;font-size:0.88rem">｜${orders.length} 筆、${totalQty} 包、${noOrders.length} 筆無需${early ? `、${early} 筆移至此日` : ''}</span>
          <br><span style="font-size:0.78rem;line-height:1.8">${detail}</span>
        </span>
      </label>
    </div>`;
  }).join('') : '<div style="color:#bbb;text-align:center;padding:20px">未找到任何訂單</div>';

  document.getElementById('lineModalGroups').innerHTML = groupsHtml;
  document.getElementById('lineImportBtn').disabled = !dates.length;
}

function closeLineModal() {
  document.getElementById('lineModal').style.display = 'none';
  document.getElementById('lineTextarea').value = '';
  _lineImportData = null;
}

async function confirmLineImport() {
  const checks = document.querySelectorAll('#lineModalGroups input[type=checkbox]:checked');
  if (!checks.length) { toast('請勾選要匯入的出貨日'); return; }

  // Collect all orders keyed by ship date.
  const byShipDate = {}; // { "YYYY-MM-DD": { storeName: qty } }
  const noOrdersByDate = {};
  for (const cb of checks) {
    const { orders, noOrders } = _lineImportData[cb.value] || {};
    if (!orders) continue;
    orders.forEach(o => {
      if (!byShipDate[o.shipDate]) byShipDate[o.shipDate] = {};
      byShipDate[o.shipDate][o.store] = (byShipDate[o.shipDate][o.store] || 0) + o.qty;
    });
    (noOrders || []).forEach(store => {
      if (!noOrdersByDate[cb.value]) noOrdersByDate[cb.value] = {};
      noOrdersByDate[cb.value][store] = true;
    });
  }

  const shipDates = [...new Set([...Object.keys(byShipDate), ...Object.keys(noOrdersByDate)])].sort();
  for (const dateStr of shipDates) {
    const stores = byShipDate[dateStr] || {};
    const noOrders = noOrdersByDate[dateStr] || {};
    const payload = { date: dateStr, updatedAt: new Date().toISOString() };
    if (Object.keys(stores).length) payload.stores = stores;
    if (Object.keys(noOrders).length) payload.noOrders = noOrders;
    await db.collection('orders_wuxian').doc(`五鮮級_${dateStr}`).set(
      payload,
      { merge: true }
    );
  }

  closeLineModal();
  toast(`✓ 已存入 ${shipDates.length} 個出貨日`);
  setDate(shipDates[0]);
}

function renderMissingList() {
  const countEl = document.getElementById('missingCount');
  const listEl  = document.getElementById('missingList');
  const ordered = new Set(Object.keys(todayOrders).filter(k => todayOrders[k] > 0));
  const noNeed = new Set(Object.keys(todayNoOrders));
  const early = new Set(Object.keys(_earlyOrders));
  const missing = STORES.filter(s => !ordered.has(s.n) && !noNeed.has(s.n) && !early.has(s.n));

  countEl.textContent = `（${missing.length} 家）`;

  const chips = [];
  STORES.forEach(s => {
    if (ordered.has(s.n)) return;
    if (noNeed.has(s.n)) {
      chips.push(`<span class="missing-chip">${s.n}<span class="tag">無需</span></span>`);
      return;
    }
    if (_earlyOrdersReady && _earlyOrders[s.n]) {
      const dd = _earlyOrders[s.n];
      const label = `${parseInt(dd.slice(5,7))}/${parseInt(dd.slice(8,10))}`;
      chips.push(`<span class="missing-chip">${s.n}<span class="tag early">已移至 ${label} 出貨</span></span>`);
      return;
    }
    const tag = s.dayOff
      ? `<span class="tag dayoff">休${s.dayOff}</span>`
      : '<span class="tag missing">未叫</span>';
    chips.push(`<span class="missing-chip">${s.n}${tag}</span>`);
  });

  if (!chips.length) {
    listEl.innerHTML = '<span class="missing-chip"><span class="tag early">全數已叫貨</span></span>';
    return;
  }

  listEl.innerHTML = chips.join('');
}

async function loadEarlyOrders() {
  _earlyOrders = {};
  _earlyOrdersReady = false;
  const base = new Date(currentDate + 'T00:00:00');
  const reads = [];
  for (let i = 1; i <= 7; i++) {
    const d = new Date(base);
    d.setDate(d.getDate() + i);
    const dateStr = fmtDate(d);
    reads.push(
      db.collection('orders_wuxian').doc(`五鮮級_${dateStr}`).get().then(snap => {
        if (snap.exists && snap.data().stores)
          Object.keys(normalizeOrderStores(snap.data().stores)).forEach(name => {
            if (!_earlyOrders[name]) _earlyOrders[name] = dateStr;
          });
      })
    );
  }
  await Promise.all(reads);
  _earlyOrdersReady = true;
  renderMissingList();
}

// ── Toast ─────────────────────────────────────────────
let _toastTimer;
function toast(msg) {
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.style.opacity = 1;
  clearTimeout(_toastTimer);
  _toastTimer = setTimeout(() => el.style.opacity = 0, 2400);
}
