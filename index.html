<body>

<header>
  <h1>五鮮級下單</h1>
  <div class="date-badge" id="headerDate">載入中…</div>
</header>

<div class="main">

  <!-- 填單區 -->
  <div class="card" id="formCard">
    <div>
      <label for="storeInput">門市名稱</label>

</div>

<!-- PIN 輸入 overlay -->

<!-- LINE 匯入 Modal -->
<div id="lineModal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:300;overflow-y:auto;padding:16px;">

<script>
// ── 門市資料 ──────────────────────────────────────────
// dayOff: 固定公休（僅顯示用，不影響下單）
// active: false → 已停業，不顯示在下拉選單
const STORES = [

  { r:"屏東", n:"東港店" },
  { r:"屏東", n:"潮州店" },
  { r:"屏東", n:"公園店" },
  { r:"屏東", n:"永大店" },
  { r:"屏東", n:"里港店" },

  { r:"燒甲", n:"燒甲佳里店" },
  { r:"燒甲", n:"燒甲陽明店" },
  { r:"燒甲", n:"燒甲嘉義民北店" },
];

// ── Firebase ──────────────────────────────────────────
const firebaseConfig = {
  apiKey: "AIzaSyBB9jPOLfJTBcW6bu1UL-KcF5SIaHhricA",
  authDomain: "hanbaoclam-2c65e.firebaseapp.com",
  projectId: "hanbaoclam-2c65e",
  storageBucket: "hanbaoclam-2c65e.firebasestorage.app",
  messagingSenderId: "155015616415",
  appId: "1:155015616415:web:b0e9988185778a00c20faa"
};
if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

// ── 狀態 ─────────────────────────────────────────────
let shipDate = "";          // 本次下單對應的出貨日（固定，供送出下單用）
let currentDate = "";       // 管理員正在查看的出貨日（可切換）
let todayOrders = {};
let unsubscribe = null;

// ── 計算出貨日（一三五下單 → 二四六出貨）─────────────
function getNextShipDate() {
  const today = new Date();
  const dow = today.getDay(); // 0=日,1=一,2=二,...,6=六
  const orderDays = new Set([1, 3, 5]); // 一三五
  const shipDays = new Set([2, 4, 6]);  // 二四六
  if (orderDays.has(dow)) {
    // 今天是下單日，出貨日是明天
    const d = new Date(today);
    d.setDate(d.getDate() + 1);
    return d;
  }
  if (shipDays.has(dow)) {
    // 今天是出貨日，追加的單仍算這批
    return new Date(today);
  }
  // 日（休息日），找下一個下單日的隔天
  for (let i = 1; i <= 7; i++) {
    const d = new Date(today);
    d.setDate(d.getDate() + i);
    if (orderDays.has(d.getDay())) {
      d.setDate(d.getDate() + 1);
      return d;
    }
  }
  // fallback
  const d = new Date(today); d.setDate(d.getDate() + 1); return d;
}

// ── 判斷門市是否在指定日期仍開業 ──────────────────────
function isOpen(store, dateStr) {
  if (!store.closeDate) return true;
  return dateStr < store.closeDate;   // closeDate 當天已關，之前都算開
}
function activeStores(dateStr) {
  return STORES.filter(s => isOpen(s, dateStr));
}

// ── 初始化 ─────────────────────────────────────────────
window.onload = () => {
  shipDate = fmtDate(getNextShipDate());
  // Header：固定顯示本週下單日 → 出貨日，不隨管理員切換
  const orderDateObj = new Date(shipDate + "T00:00:00");
  orderDateObj.setDate(orderDateObj.getDate() - 1);
  document.getElementById("headerDate").textContent =
    `${fmtShort(fmtDate(orderDateObj))} 下單 → ${fmtShort(shipDate)} 出貨`;
  setViewDate(shipDate);

  const todayStr = fmtDate(new Date());
  const openList = activeStores(todayStr);

  // datalist（文字輸入autocomplete）
  const dl = document.getElementById("storeDatalist");
  openList.forEach(s => {
    const opt = document.createElement("option");
    opt.value = s.n;
    dl.appendChild(opt);
  });

  // 下拉選單（備用）
  const sel = document.getElementById("storeSelect");
  const regions = [...new Set(openList.map(s => s.r))];
  regions.forEach(r => {
    const grp = document.createElement("optgroup");
    grp.label = r;
    openList.filter(s => s.r === r).forEach(s => {
      const opt = document.createElement("option");
      opt.value = s.n;
      opt.textContent = s.n + (s.dayOff ? ` (休${s.dayOff})` : "");
      grp.appendChild(opt);
    });
    sel.appendChild(grp);
  });

  document.getElementById("storeInput").addEventListener("keydown", e => {
    if (e.key === "Enter") document.getElementById("qtyInput").focus();
  });
  document.getElementById("qtyInput").addEventListener("keydown", e => {
    if (e.key === "Enter") submitOrder();
  });
};

const WEEKDAYS = ["日","一","二","三","四","五","六"];
function fmtDate(d) {
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,"0");
  const day = String(d.getDate()).padStart(2,"0");
  return `${y}-${m}-${day}`;
}
function fmtShort(str) {
  if (!str) return "";
  const d = new Date(str + "T00:00:00");
  return `${d.getMonth()+1}/${d.getDate()}（${WEEKDAYS[d.getDay()]}）`;
}

function setViewDate(dateStr) {
  currentDate = dateStr;
  document.getElementById("adminDate").value = dateStr;
  listenOrders();
}

// ── 即時監聽訂單 ──────────────────────────────────────
function listenOrders() {
  if (unsubscribe) unsubscribe();
  if (!currentDate) return;
  const docId = `五鮮級_${currentDate}`;
  unsubscribe = db.collection("orders_wuxian").doc(docId).onSnapshot(snap => {
    todayOrders = (snap.exists && snap.data().stores) ? snap.data().stores : {};
    renderOrderList();
  });
}

// ── 下拉備用切換 ─────────────────────────────────────
function toggleStoreSelect() {
  document.getElementById("storeSelect").classList.toggle("show");
}
function storeSelectChanged() {
  const v = document.getElementById("storeSelect").value;
  if (v) document.getElementById("storeInput").value = v;
}

// ── 送出下單 ──────────────────────────────────────────
async function submitOrder() {
  const store = document.getElementById("storeInput").value.trim()
             || document.getElementById("storeSelect").value;
  const qty   = parseInt(document.getElementById("qtyInput").value) || 0;
  if (!store) { toast("請輸入門市名稱"); return; }
  if (qty < 2) { toast("最低下單量為 2 包"); return; }

  const btn = document.getElementById("submitBtn");
  btn.disabled = true;
  btn.textContent = "送出中…";

  const docId = `五鮮級_${shipDate}`;
  try {
    await db.collection("orders_wuxian").doc(docId).set(
      { stores: { [store]: qty }, date: shipDate, updatedAt: new Date().toISOString() },
      { merge: true }
    );
    // 顯示成功
    document.getElementById("formCard").style.display = "none";
    document.getElementById("successCard").style.display = "block";
    document.getElementById("successTitle").textContent = `${store} 下單成功`;
    const box = calcBox(qty);
    document.getElementById("successSub").textContent =
      `${qty} 包 (${qty*5} 斤）｜${box.count}${box.type} 箱`;
  } catch(e) {
    toast("送出失敗：" + e.message);
    btn.disabled = false;
    btn.textContent = "送出下單";
  }
}

function resetForm() {
  document.getElementById("formCard").style.display = "block";
  document.getElementById("successCard").style.display = "none";
  document.getElementById("submitBtn").disabled = false;
  document.getElementById("submitBtn").textContent = "送出下單";
  document.getElementById("storeInput").value = "";
  document.getElementById("storeSelect").value = "";
  document.getElementById("qtyInput").value = 2;
  document.getElementById("storeInput").focus();
}

// ── 數量±按鈕 ─────────────────────────────────────────
function adjustQty(delta) {
  const el = document.getElementById("qtyInput");
  const v = (parseInt(el.value) || 0) + delta;
  el.value = Math.max(2, Math.min(99, v));
}

// ── 計算箱型 ─────────────────────────────────────────
function calcBox(qty) {
  if (qty <= 2) return { type: "D", count: 1 };
  return { type: "C", count: Math.ceil(qty / 7) };
}

// ── 渲染訂單列表 ──────────────────────────────────────
function renderOrderList() {
  const box = document.getElementById("orderList");
  const knownNames = new Set(STORES.map(s => s.n));

  const storeList = activeStores(currentDate);
  const ordered = storeList
    .filter(s => todayOrders[s.n] > 0)
    .map(s => ({ n: s.n, qty: todayOrders[s.n] }));
  Object.keys(todayOrders).forEach(name => {
    if (!knownNames.has(name) && todayOrders[name] > 0)
      ordered.push({ n: name, qty: todayOrders[name] });
  });

  const pending = storeList.filter(s => !(todayOrders[s.n] > 0));

  let html = "";

  if (!ordered.length) {
    html += '<div class="no-orders">尚無訂單</div>';
  } else {
    const totalPkg = ordered.reduce((s, e) => s + e.qty, 0);
    html += ordered.map(e =>
      `<div class="order-item">
        <span class="order-name">${e.n}</span>
        <span class="order-qty">${e.qty} 包</span>
      </div>`
    ).join("") + `<div class="order-total">
      <span>共 ${ordered.length} 家</span>
      <span>${totalPkg} 包</span>
    </div>`;
  }

  if (pending.length) {
    html += `<div class="pending-title">未叫貨（${pending.length} 家）</div>
    <div class="pending-tags">
      ${pending.map(s => `<span class="pending-tag">${s.n}${s.dayOff ? `<span style="color:#e65100;margin-left:3px;font-size:0.72rem;">休${s.dayOff}</span>` : ""}</span>`).join("")}
    </div>`;
  }

  box.innerHTML = html;
}

// ── 管理員 ────────────────────────────────────────────
let adminUnlocked = false;
function toggleAdmin() {
  const panel = document.getElementById("adminPanel");
  if (panel.classList.contains("open")) {
    panel.classList.remove("open");
    return;
  }
  if (adminUnlocked) { panel.classList.add("open"); return; }
  openPinOverlay();
}
function openPinOverlay() {
  const ov = document.getElementById("pinOverlay");
  ov.style.display = "flex";
  document.getElementById("pinInput").value = "";
  document.getElementById("pinError").textContent = "";
  setTimeout(() => document.getElementById("pinInput").focus(), 50);
}
function closePinOverlay() {
  document.getElementById("pinOverlay").style.display = "none";
}
function confirmPin() {
  const val = document.getElementById("pinInput").value;
  if (val === "7798") {
    adminUnlocked = true;
    closePinOverlay();
    document.getElementById("adminPanel").classList.add("open");
  } else {
    document.getElementById("pinError").textContent = "PIN 碼錯誤，請再試一次";
    document.getElementById("pinInput").value = "";
    document.getElementById("pinInput").focus();
  }
}

function changeDate() {
  const d = document.getElementById("adminDate").value;
  if (!d) return;
  setViewDate(d);
  toast(`切換到 ${fmtDateCN(d)}`);
}

function clearDate() {
  if (!confirm(`確定清除 ${currentDate} 所有訂單？`)) return;
  const docId = `五鮮級_${currentDate}`;
  db.collection("orders_wuxian").doc(docId).delete()
    .then(() => toast("已清除"))
    .catch(e => toast("失敗：" + e.message));
}

// ── 匯出 Excel ────────────────────────────────────────
function exportExcel() {
  const wb = XLSX.utils.book_new();

  // Sheet 1：全部門市（依帳務順序，0包的也列出）
  const header = ["區域", "門市", "下單量(包)", "總斤數", "箱型", "箱數"];
  const rows = [header];
  activeStores(currentDate).forEach(s => {
    const qty = todayOrders[s.n] || 0;
    if (qty > 0) {
      const b = calcBox(qty);
      rows.push([s.r, s.n, qty, qty*5, b.type, b.count]);
    } else {
      rows.push([s.r, s.n, 0, 0, "-", "-"]);
    }
  });

  const ws = XLSX.utils.aoa_to_sheet(rows);
  ws["!cols"] = [{wch:6},{wch:14},{wch:12},{wch:10},{wch:6},{wch:6}];
  XLSX.utils.book_append_sheet(wb, ws, currentDate.replace(/-/g,""));

  XLSX.writeFile(wb, `五鮮級_${currentDate}.xlsx`);
  toast("✓ Excel 已下載");
}

// ── Toast ─────────────────────────────────────────────
let _toastTimer;
function toast(msg) {
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.style.opacity = 1;
  clearTimeout(_toastTimer);
  _toastTimer = setTimeout(() => el.style.opacity = 0, 2400);
}

function fmtDateCN(str) {
  if (!str) return "";
  const d = new Date(str + "T00:00:00");
  return `${d.getMonth()+1}/${d.getDate()}（${WEEKDAYS[d.getDay()]}）`;
}

function escHtml(s) {
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}

// ── LINE 訂單匯入 ─────────────────────────────────────
let _parsedLineOrders = [];

function handleLineFile(evt) {
  const file = evt.target.files[0];
  evt.target.value = "";
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    _parsedLineOrders = parseLineOrders(e.target.result);
    showLineModal();
  };
  reader.readAsText(file, "UTF-8");
}

function parseLineOrders(text) {
  const lines = text.split(/\r?\n/);
  let year = new Date().getFullYear();
  let blocks = [];
  let cur = null;

  for (const raw of lines) {
    const line = raw.trim();
    if (!line) continue;

    // 日期標題：2026.05.07 星期四
    const dh = line.match(/^(\d{4})\.(\d{2})\.(\d{2})\s+星期/);
    if (dh) { year = parseInt(dh[1]); if (cur) blocks.push(cur); cur = null; continue; }

    // 訊息開頭：HH:MM 發送者 內容
    const mh = line.match(/^(\d{2}):(\d{2})\s+([\s\S]*)/);
    if (mh) { if (cur) blocks.push(cur); cur = { text: mh[3], year }; continue; }

    // 跳過上傳者標記
    if (cur && !line.startsWith("上傳者：")) cur.text += "\n" + line;
  }
  if (cur) blocks.push(cur);

  const orders = [];
  for (const b of blocks) {
    const t = b.text;

    // 必須有包數欄位
    const qM = t.match(/蛤蜊[^：:\n]*[：:]\s*(\d+)/);
    if (!qM) continue;

    // 到貨日
    const dM = t.match(/到貨日[：:]\s*(\d{1,2})\/(\d{1,2})/);
    if (!dM) continue;

    // 店名
    const sM = t.match(/店[\s　]*名[：:]\s*([^\n]*)/);
    let rawStore = sM ? sM[1].trim() : "";

    // 店名空白時從發送者那行抓
    if (!rawStore) {
      const firstLine = t.split("\n")[0];
      const fm = firstLine.match(/五鮮級[\s-]?(\S+店)/) || firstLine.match(/(\S+店)\s*$/);
      if (fm) rawStore = fm[1];
    }
    if (!rawStore) continue;

    const qty = parseInt(qM[1]);
    if (qty < 1) continue;
    const month = dM[1].padStart(2, "0");
    const day   = dM[2].padStart(2, "0");
    const shipDate = `${b.year}-${month}-${day}`;
    const matchedName = matchStoreName(rawStore);

    orders.push({ rawStore, matchedName, qty, shipDate });
  }
  return orders;
}

function matchStoreName(raw) {
  if (!raw) return null;
  const norm = raw.replace(/^五鮮級[-－\s]?/, "").trim();
  // 完全比對
  let found = STORES.find(s => s.n === raw || s.n === norm);
  if (found) return found.n;
  // 包含比對
  found = STORES.find(s => norm.includes(s.n) || s.n.includes(norm));
  return found ? found.n : null;
}

function showLineModal() {
  if (!_parsedLineOrders.length) {
    toast("找不到訂單格式，請確認是否為正確的 LINE 匯出檔");
    return;
  }

  // 依出貨日分組
  const byDate = {};
  _parsedLineOrders.forEach(o => {
    if (!byDate[o.shipDate]) byDate[o.shipDate] = [];
    byDate[o.shipDate].push(o);
  });

  const unmatched = _parsedLineOrders.filter(o => !o.matchedName).length;
  let sub = `共解析 ${_parsedLineOrders.length} 筆訂單`;
  if (unmatched) sub += `，其中 ${unmatched} 筆店名未比對到（以原始名稱存入）`;
  document.getElementById("lineModalSub").textContent = sub;

  let html = "";
  for (const date of Object.keys(byDate).sort()) {
    const rows = byDate[date];
    html += `<div style="margin-bottom:14px;">
      <div style="font-weight:600;font-size:0.9rem;margin-bottom:6px;color:#333;">
        出貨日：${fmtDateCN(date)}（${rows.length} 筆）
      </div>
      <table style="width:100%;border-collapse:collapse;font-size:0.84rem;">
        <thead>
          <tr style="background:#f0f0f0;">
            <th style="padding:5px 8px;text-align:left;border:1px solid #ddd;">LINE 店名</th>
            <th style="padding:5px 8px;text-align:center;border:1px solid #ddd;">包數</th>
            <th style="padding:5px 8px;text-align:left;border:1px solid #ddd;">比對結果</th>
          </tr>
        </thead>
        <tbody>`;
    rows.forEach(o => {
      const status = o.matchedName
        ? `<span style="color:#2e7d32;">✓ ${escHtml(o.matchedName)}</span>`
        : `<span style="color:#c62828;">⚠ 未比對（${escHtml(o.rawStore)}）</span>`;
      html += `<tr>
        <td style="padding:5px 8px;border:1px solid #ddd;">${escHtml(o.rawStore)}</td>
        <td style="padding:5px 8px;text-align:center;border:1px solid #ddd;">${o.qty}</td>
        <td style="padding:5px 8px;border:1px solid #ddd;">${status}</td>
      </tr>`;
    });
    html += `</tbody></table></div>`;
  }

  document.getElementById("lineModalBody").innerHTML = html;
  document.getElementById("lineModal").style.display = "block";
}

function closeLineModal() {
  document.getElementById("lineModal").style.display = "none";
  _parsedLineOrders = [];
}

async function confirmLineImport() {
  if (!_parsedLineOrders.length) return;

  // 依出貨日合併（同店同日以最後一筆為準）
  const byDate = {};
  _parsedLineOrders.forEach(o => {
    const name = o.matchedName || o.rawStore;
    if (!byDate[o.shipDate]) byDate[o.shipDate] = {};
    byDate[o.shipDate][name] = o.qty;
  });

  const btn = document.getElementById("lineConfirmBtn");
  btn.disabled = true; btn.textContent = "匯入中…";

  try {
    await Promise.all(Object.entries(byDate).map(([date, stores]) =>
      db.collection("orders_wuxian").doc(`五鮮級_${date}`).set(
        { stores, date, updatedAt: new Date().toISOString() },
        { merge: true }
      )
    ));
    closeLineModal();
    toast(`已匯入 ${_parsedLineOrders.length} 筆訂單`);
  } catch(e) {
    toast("匯入失敗：" + e.message);
    btn.disabled = false; btn.textContent = "✓ 確認匯入";
  }
}
