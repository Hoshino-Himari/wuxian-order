<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>五鮮級下單</title>
  <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: "Noto Sans TC", "PingFang TC", sans-serif; background: #f0f4f0; color: #222; font-size: 16px; min-height: 100vh; }

    header { background: #1e6b3e; color: white; padding: 16px 20px; text-align: center; }
    header h1 { font-size: 1.2rem; font-weight: 700; letter-spacing: .04em; }
    .date-badge { display: inline-block; margin-top: 6px; background: rgba(255,255,255,.2);
                  border-radius: 20px; padding: 4px 14px; font-size: 0.88rem; }

    .main { max-width: 480px; margin: 0 auto; padding: 20px 16px 40px; }

    .card { background: white; border-radius: 14px; box-shadow: 0 2px 10px rgba(0,0,0,.08); padding: 22px 20px; margin-bottom: 16px; }

    label { display: block; font-weight: 600; margin-bottom: 8px; color: #444; font-size: 0.92rem; }
    .store-input-wrap { position: relative; }
    input[type=text], select, input[type=number] {
      width: 100%; padding: 13px 14px; border: 1.5px solid #ddd; border-radius: 10px;
      font-size: 1rem; font-family: inherit; color: #222; background: #fafafa;
      appearance: none; -webkit-appearance: none;
    }
    input[type=text]:focus, select:focus, input[type=number]:focus { outline: none; border-color: #1e6b3e; background: white; }
    .store-select-toggle { font-size: 0.78rem; color: #888; margin-top: 6px; cursor: pointer;
                           text-decoration: underline; background: none; border: none; padding: 0; }
    select.store-select { margin-top: 8px; display: none; }
    select.store-select.show { display: block; }
    .qty-wrap { margin-top: 14px; }
    .qty-row { display: flex; align-items: center; gap: 10px; }
    .qty-row input { text-align: center; font-size: 1.4rem; font-weight: 700; }
    .qty-btn { width: 48px; height: 48px; border: none; border-radius: 10px;
               background: #e8f5e9; color: #1e6b3e; font-size: 1.6rem; font-weight: 700;
               cursor: pointer; flex-shrink: 0; display: flex; align-items: center; justify-content: center; }
    .qty-btn:active { background: #c8e6c9; }

    .btn-submit { display: block; width: 100%; padding: 16px; background: #1e6b3e; color: white;
                  border: none; border-radius: 12px; font-size: 1.1rem; font-weight: 700;
                  cursor: pointer; margin-top: 18px; letter-spacing: .06em; }
    .btn-submit:active { background: #155230; }
    .btn-submit:disabled { background: #aaa; cursor: not-allowed; }

    /* 送出成功畫面 */
    .success-card { text-align: center; padding: 30px 20px; }
    .success-icon { font-size: 3rem; margin-bottom: 10px; }
    .success-title { font-size: 1.3rem; font-weight: 700; color: #1e6b3e; margin-bottom: 6px; }
    .success-sub { color: #666; font-size: 0.92rem; margin-bottom: 20px; }
    .btn-edit { padding: 10px 24px; border: 1.5px solid #1e6b3e; color: #1e6b3e;
                background: white; border-radius: 8px; font-size: 0.95rem; cursor: pointer; font-weight: 600; }

    /* 今日訂單列表 */
    .order-list { margin-top: 6px; }
    .order-item { display: flex; justify-content: space-between; align-items: center;
                  padding: 8px 0; border-bottom: 1px solid #f0f0f0; }
    .order-item:last-child { border-bottom: none; }
    .order-name { font-weight: 600; }
    .order-qty { font-weight: 700; color: #1e6b3e; }
    .no-orders { text-align: center; color: #bbb; padding: 20px 0; font-size: 0.92rem; }
    .order-total { display: flex; justify-content: space-between; padding: 10px 0 0;
                   border-top: 2px solid #e8f5e9; margin-top: 6px; font-weight: 700; color: #1e6b3e; }

    /* 管理員區塊 */
    .admin-toggle { text-align: center; margin-bottom: 12px; }
    .btn-link { background: none; border: none; color: #999; font-size: 0.82rem;
                cursor: pointer; text-decoration: underline; }
    .admin-panel { display: none; }
    .admin-panel.open { display: block; }
    .admin-row { display: flex; gap: 8px; flex-wrap: wrap; }
    .btn-sm { padding: 9px 16px; border: none; border-radius: 8px; font-size: 0.88rem;
              cursor: pointer; font-weight: 600; }
    .btn-blue   { background: #1565c0; color: white; }
    .btn-orange { background: #e65100; color: white; }
    .btn-gray   { background: #e0e0e0; color: #555; }
    .btn-sm:active { opacity: .8; }
    .date-set-row { display: flex; gap: 8px; align-items: center; margin-bottom: 12px; }
    .date-set-row input[type=date] { flex: 1; padding: 9px 12px; border: 1.5px solid #ddd;
                                      border-radius: 8px; font-size: 0.92rem; font-family: inherit; }
    .date-set-row input[type=date]:focus { outline: none; border-color: #1e6b3e; }

    /* LINE 匯入 */
    .line-import-section { margin-top: 18px; border-top: 1.5px solid #e8f5e9; padding-top: 16px; }
    .line-import-section .section-title { margin-bottom: 10px; }
    .line-date-row { display: flex; gap: 8px; align-items: center; margin-bottom: 10px; }
    .line-date-row label { font-size: 0.88rem; color: #555; white-space: nowrap; margin: 0; font-weight: 600; }
    .line-date-row input[type=date] { flex: 1; padding: 9px 12px; border: 1.5px solid #ddd;
                                       border-radius: 8px; font-size: 0.92rem; font-family: inherit; }
    .line-date-row input[type=date]:focus { outline: none; border-color: #1e6b3e; }
    .line-delivery-hint { font-size: 0.8rem; color: #1e6b3e; margin-bottom: 10px; }
    .line-textarea { width: 100%; min-height: 120px; padding: 10px 12px; border: 1.5px solid #ddd;
                     border-radius: 10px; font-size: 0.88rem; font-family: inherit; resize: vertical;
                     background: #fafafa; color: #222; }
    .line-textarea:focus { outline: none; border-color: #1e6b3e; background: white; }
    .line-preview { margin-top: 10px; background: #f5faf6; border-radius: 10px; padding: 12px 14px;
                    font-size: 0.88rem; display: none; }
    .line-preview-title { font-weight: 700; color: #1e6b3e; margin-bottom: 8px; }
    .line-preview-item { display: flex; justify-content: space-between; padding: 4px 0;
                         border-bottom: 1px solid #e0f0e3; }
    .line-preview-item:last-child { border-bottom: none; }
    .line-preview-warn { color: #e65100; font-size: 0.82rem; margin-top: 6px; }
    .line-btn-row { display: flex; gap: 8px; margin-top: 10px; }
    .live-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%;
                background: #4caf50; margin-right: 5px; animation: blink 1.5s infinite; }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:.3} }
    .section-title { font-weight: 700; color: #1e6b3e; margin-bottom: 10px; font-size: 0.92rem; }
    .dayoff-tag { font-size: 0.7rem; color: #e65100; background: #fff3e0; border-radius: 4px;
                  padding: 1px 5px; margin-left: 4px; }
    #toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
             background: #333; color: white; padding: 10px 22px; border-radius: 22px;
             font-size: 0.88rem; opacity: 0; transition: opacity .3s; pointer-events: none; z-index: 99; }
  </style>
</head>
<body>

<header>
  <h1>🦪 五鮮級下單</h1>
  <div class="date-badge" id="headerDate">載入中…</div>
</header>

<div class="main">

  <!-- 填單區 -->
  <div class="card" id="formCard">
    <div>
      <label for="storeInput">門市名稱</label>
      <input type="text" id="storeInput" list="storeDatalist" placeholder="輸入關鍵字…" autocomplete="off">
      <datalist id="storeDatalist"></datalist>
      <button class="store-select-toggle" onclick="toggleStoreSelect()">或從列表選擇 ▾</button>
      <select class="store-select" id="storeSelect" onchange="storeSelectChanged()">
        <option value="">── 請選擇 ──</option>
      </select>
    </div>
    <div class="qty-wrap">
      <label>下單數量（包）</label>
      <div class="qty-row">
        <button class="qty-btn" onclick="adjustQty(-1)">−</button>
        <input type="number" id="qtyInput" value="1" min="1" max="99" inputmode="numeric">
        <button class="qty-btn" onclick="adjustQty(1)">+</button>
      </div>
    </div>
    <button class="btn-submit" id="submitBtn" onclick="submitOrder()">送出下單</button>
  </div>

  <!-- 送出成功 -->
  <div class="card success-card" id="successCard" style="display:none">
    <div class="success-icon">✅</div>
    <div class="success-title" id="successTitle">下單成功</div>
    <div class="success-sub" id="successSub"></div>
    <button class="btn-edit" onclick="resetForm()">修改 / 重新填寫</button>
  </div>

  <!-- 今日訂單 -->
  <div class="card">
    <div class="section-title">
      <span class="live-dot"></span>今日訂單
    </div>
    <div class="order-list" id="orderList">
      <div class="no-orders">尚無訂單</div>
    </div>
  </div>

  <!-- 管理員 -->
  <div class="admin-toggle">
    <button class="btn-link" onclick="toggleAdmin()">管理員操作 ▾</button>
  </div>
  <div class="admin-panel card" id="adminPanel">
    <div class="date-set-row">
      <input type="date" id="adminDate">
      <button class="btn-sm btn-gray" onclick="changeDate()">切換日期</button>
    </div>
    <div class="admin-row">
      <button class="btn-sm btn-blue" onclick="exportExcel()">⬇ 下載 Excel</button>
      <button class="btn-sm btn-orange" onclick="clearDate()">🗑 清除此日</button>
    </div>
    <div id="saveStatus" style="margin-top:10px;font-size:0.82rem;color:#666;"></div>

    <!-- LINE 叫貨紀錄匯入 -->
    <div class="line-import-section">
      <div class="section-title">📋 LINE 叫貨紀錄匯入</div>
      <div class="line-date-row">
        <label>下單日：</label>
        <input type="date" id="lineOrderDate" onchange="updateDeliveryHint()">
      </div>
      <div class="line-delivery-hint" id="lineDeliveryHint"></div>
      <textarea class="line-textarea" id="lineText" placeholder="貼上 LINE 叫貨訊息…&#10;&#10;範例：&#10;新豐店 3&#10;員林店 2包&#10;豐原店：5"></textarea>
      <div class="line-btn-row">
        <button class="btn-sm btn-gray" onclick="parseLineText()">解析預覽</button>
        <button class="btn-sm btn-blue" id="lineUploadBtn" onclick="uploadLineOrders()" style="display:none">⬆ 上傳到貨日</button>
      </div>
      <div class="line-preview" id="linePreview"></div>
    </div>
  </div>

</div>

<div id="toast"></div>

<script>
// ── 門市資料 ──────────────────────────────────────────
// dayOff: 固定公休（僅顯示用，不影響下單）
// active: false → 已停業，不顯示在下拉選單
const STORES = [
  { r:"新竹", n:"新豐店" },
  { r:"新竹", n:"環北店" },
  { r:"新竹", n:"旗艦店" },

  { r:"台中", n:"中興店" },
  { r:"台中", n:"大里中興店", dayOff:"週二、三" },
  { r:"台中", n:"豐原店" },
  { r:"台中", n:"霧峰店" },

  { r:"南投", n:"埔里店" },
  { r:"南投", n:"草屯店" },

  { r:"彰化", n:"員林店" },
  { r:"彰化", n:"社頭店", dayOff:"週二、三" },
  { r:"彰化", n:"北斗店" },
  { r:"彰化", n:"溪湖店" },
  { r:"彰化", n:"和美店" },
  { r:"彰化", n:"中正店" },
  { r:"彰化", n:"鹿港店" },

  { r:"雲林", n:"斗六店" },
  { r:"雲林", n:"西螺店" },
  { r:"雲林", n:"北港店" },

  { r:"嘉義", n:"民族店" },
  { r:"嘉義", n:"水上店", dayOff:"週三、四" },
  { r:"嘉義", n:"大林店" },
  { r:"嘉義", n:"太保店", dayOff:"週一、二" },
  { r:"嘉義", n:"新港店", dayOff:"週二、三" },
  { r:"嘉義", n:"朴子店" },

  { r:"台南", n:"大灣店" },
  { r:"台南", n:"新營店" },
  { r:"台南", n:"國平店" },
  // 北門店 5/11 起停業
  { r:"台南", n:"仁德店" },
  { r:"台南", n:"永康店" },
  { r:"台南", n:"東平店" },
  { r:"台南", n:"安南店" },
  { r:"台南", n:"新市店" },
  { r:"台南", n:"永成店" },
  { r:"台南", n:"善化店" },
  { r:"台南", n:"佳里店" },
  { r:"台南", n:"麻豆店" },
  { r:"台南", n:"學甲店" },
  { r:"台南", n:"路竹店" },

  { r:"高雄", n:"新鼓山店" },
  { r:"高雄", n:"建工店" },
  { r:"高雄", n:"小港店" },
  { r:"高雄", n:"鳳山店" },
  { r:"高雄", n:"七賢店" },
  { r:"高雄", n:"楠梓店" },
  { r:"高雄", n:"藍田店" },
  { r:"高雄", n:"寶陽店" },
  { r:"高雄", n:"岡山旗艦店" },
  { r:"高雄", n:"鼎力店" },
  { r:"高雄", n:"左營店" },
  { r:"高雄", n:"仁武店" },
  { r:"高雄", n:"旗山店" },
  { r:"高雄", n:"林園店" },
  { r:"高雄", n:"大昌店", phone:"07-3927380", deliveryDays:"一三五", note:"5/28開幕" },

  { r:"屏東", n:"東港店" },
  { r:"屏東", n:"潮州店" },
  { r:"屏東", n:"公園店" },
  { r:"屏東", n:"永大店" },
  { r:"屏東", n:"里港店" },

  { r:"燒甲", n:"燒甲佳里店" },
  { r:"燒甲", n:"燒甲陽明店" },
  { r:"燒甲", n:"燒甲嘉義民北店" },
];

// ── Firebase ──────────────────────────────────────────
const firebaseConfig = {
  apiKey: "AIzaSyBB9jPOLfJTBcW6bu1UL-KcF5SIaHhricA",
  authDomain: "hanbaoclam-2c65e.firebaseapp.com",
  projectId: "hanbaoclam-2c65e",
  storageBucket: "hanbaoclam-2c65e.firebasestorage.app",
  messagingSenderId: "155015616415",
  appId: "1:155015616415:web:b0e9988185778a00c20faa"
};
if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

// ── 狀態 ─────────────────────────────────────────────
let currentDate = "";       // YYYY-MM-DD，to 到貨日
let todayOrders = {};       // { storeName: qty }
let unsubscribe = null;

// ── 初始化 ─────────────────────────────────────────────
window.onload = () => {
  // 預設明天
  const tomorrow = new Date();
  tomorrow.setDate(tomorrow.getDate() + 1);
  setDate(fmtDate(tomorrow));

  // datalist（文字輸入autocomplete）
  const dl = document.getElementById("storeDatalist");
  STORES.forEach(s => {
    const opt = document.createElement("option");
    opt.value = s.n;
    dl.appendChild(opt);
  });

  // 下拉選單（備用）
  const sel = document.getElementById("storeSelect");
  const regions = [...new Set(STORES.map(s => s.r))];
  regions.forEach(r => {
    const grp = document.createElement("optgroup");
    grp.label = r;
    STORES.filter(s => s.r === r).forEach(s => {
      const opt = document.createElement("option");
      opt.value = s.n;
      opt.textContent = s.n + (s.dayOff ? ` (休${s.dayOff})` : "");
      grp.appendChild(opt);
    });
    sel.appendChild(grp);
  });

  document.getElementById("storeInput").addEventListener("keydown", e => {
    if (e.key === "Enter") document.getElementById("qtyInput").focus();
  });
  document.getElementById("qtyInput").addEventListener("keydown", e => {
    if (e.key === "Enter") submitOrder();
  });
};

function fmtDate(d) { return d.toISOString().slice(0,10); }
function fmtDateCN(str) {
  if (!str) return "";
  const [y,m,d] = str.split("-");
  return `${y}年${parseInt(m)}月${parseInt(d)}日 到貨`;
}

function setDate(dateStr) {
  currentDate = dateStr;
  document.getElementById("headerDate").textContent = fmtDateCN(dateStr);
  document.getElementById("adminDate").value = dateStr;
  listenOrders();
}

// ── 即時監聽訂單 ──────────────────────────────────────
function listenOrders() {
  if (unsubscribe) unsubscribe();
  if (!currentDate) return;
  const docId = `五鮮級_${currentDate}`;
  unsubscribe = db.collection("orders_wuxian").doc(docId).onSnapshot(snap => {
    todayOrders = (snap.exists && snap.data().stores) ? snap.data().stores : {};
    renderOrderList();
  });
}

// ── 下拉備用切換 ─────────────────────────────────────
function toggleStoreSelect() {
  document.getElementById("storeSelect").classList.toggle("show");
}
function storeSelectChanged() {
  const v = document.getElementById("storeSelect").value;
  if (v) document.getElementById("storeInput").value = v;
}

// ── 送出下單 ──────────────────────────────────────────
async function submitOrder() {
  const store = document.getElementById("storeInput").value.trim()
             || document.getElementById("storeSelect").value;
  const qty   = parseInt(document.getElementById("qtyInput").value) || 0;
  if (!store) { toast("請輸入門市名稱"); return; }
  if (qty < 1) { toast("請輸入包數"); return; }

  const btn = document.getElementById("submitBtn");
  btn.disabled = true;
  btn.textContent = "送出中…";

  const docId = `五鮮級_${currentDate}`;
  try {
    await db.collection("orders_wuxian").doc(docId).set(
      { stores: { [store]: qty }, date: currentDate, updatedAt: new Date().toISOString() },
      { merge: true }
    );
    // 顯示成功
    document.getElementById("formCard").style.display = "none";
    document.getElementById("successCard").style.display = "block";
    document.getElementById("successTitle").textContent = `${store} 下單成功`;
    const box = calcBox(qty);
    document.getElementById("successSub").textContent =
      `${qty} 包 (${qty*5} 斤）｜${box.count}${box.type} 箱`;
  } catch(e) {
    toast("送出失敗：" + e.message);
    btn.disabled = false;
    btn.textContent = "送出下單";
  }
}

function resetForm() {
  document.getElementById("formCard").style.display = "block";
  document.getElementById("successCard").style.display = "none";
  document.getElementById("submitBtn").disabled = false;
  document.getElementById("submitBtn").textContent = "送出下單";
  document.getElementById("storeInput").value = "";
  document.getElementById("storeSelect").value = "";
  document.getElementById("qtyInput").value = 1;
  document.getElementById("storeInput").focus();
}

// ── 數量±按鈕 ─────────────────────────────────────────
function adjustQty(delta) {
  const el = document.getElementById("qtyInput");
  const v = (parseInt(el.value) || 0) + delta;
  el.value = Math.max(1, Math.min(99, v));
}

// ── 計算箱型 ─────────────────────────────────────────
function calcBox(qty) {
  if (qty <= 2) return { type: "D", count: 1 };
  return { type: "C", count: Math.ceil(qty / 7) };
}

// ── 渲染訂單列表 ──────────────────────────────────────
function renderOrderList() {
  const box = document.getElementById("orderList");
  const knownNames = new Set(STORES.map(s => s.n));

  // 照 STORES 順序排，再接不在清單的
  const entries = STORES
    .filter(s => todayOrders[s.n] > 0)
    .map(s => ({ n: s.n, qty: todayOrders[s.n] }));
  Object.keys(todayOrders).forEach(name => {
    if (!knownNames.has(name) && todayOrders[name] > 0)
      entries.push({ n: name, qty: todayOrders[name] });
  });

  if (!entries.length) {
    box.innerHTML = '<div class="no-orders">尚無訂單</div>';
    return;
  }

  const totalPkg = entries.reduce((s, e) => s + e.qty, 0);
  box.innerHTML = entries.map(e =>
    `<div class="order-item">
      <span class="order-name">${e.n}</span>
      <span class="order-qty">${e.qty} 包</span>
    </div>`
  ).join("") + `<div class="order-total">
    <span>共 ${entries.length} 家</span>
    <span>${totalPkg} 包</span>
  </div>`;
}

// ── 管理員 ────────────────────────────────────────────
function toggleAdmin() {
  const panel = document.getElementById("adminPanel");
  const wasOpen = panel.classList.contains("open");
  panel.classList.toggle("open");
  if (!wasOpen) initLineOrderDate();
}

function changeDate() {
  const d = document.getElementById("adminDate").value;
  if (!d) return;
  setDate(d);
  toast(`切換到 ${fmtDateCN(d)}`);
}

function clearDate() {
  if (!confirm(`確定清除 ${currentDate} 所有訂單？`)) return;
  const docId = `五鮮級_${currentDate}`;
  db.collection("orders_wuxian").doc(docId).delete()
    .then(() => toast("已清除"))
    .catch(e => toast("失敗：" + e.message));
}

// ── 匯出 Excel ────────────────────────────────────────
function exportExcel() {
  const wb = XLSX.utils.book_new();

  // Sheet 1：出貨明細
  const header = ["區域", "門市", "下單量(包)", "總斤數", "箱型", "箱數"];
  const rows = [header];
  const regions = [...new Set(STORES.map(s => s.r))];
  let totalPkg = 0;
  regions.forEach(r => {
    STORES.filter(s => s.r === r && todayOrders[s.n] > 0).forEach(s => {
      const qty = todayOrders[s.n];
      const b = calcBox(qty);
      rows.push([r, s.n, qty, qty*5, b.type, b.count]);
      totalPkg += qty;
    });
  });
  // 不在 STORES 的
  const knownNames = new Set(STORES.map(s => s.n));
  Object.keys(todayOrders).forEach(name => {
    if (!knownNames.has(name) && todayOrders[name] > 0) {
      const qty = todayOrders[name];
      const b = calcBox(qty);
      rows.push(["其他", name, qty, qty*5, b.type, b.count]);
      totalPkg += qty;
    }
  });
  rows.push(["", "合計", totalPkg, totalPkg*5, "", ""]);

  const ws = XLSX.utils.aoa_to_sheet(rows);
  ws["!cols"] = [{wch:6},{wch:14},{wch:12},{wch:10},{wch:6},{wch:6}];
  XLSX.utils.book_append_sheet(wb, ws, currentDate.replace(/-/g,""));

  // Sheet 2：未下單門市
  const notOrdered = STORES.filter(s => !todayOrders[s.n]);
  if (notOrdered.length) {
    const ws2 = XLSX.utils.aoa_to_sheet([
      ["區域","門市"],
      ...notOrdered.map(s => [s.r, s.n])
    ]);
    ws2["!cols"] = [{wch:6},{wch:14}];
    XLSX.utils.book_append_sheet(wb, ws2, "未下單");
  }

  XLSX.writeFile(wb, `五鮮級_${currentDate}.xlsx`);
  toast("✓ Excel 已下載");
}

// ── LINE 別名對照（LINE 訊息常用簡稱 → 系統正式名稱）────
const STORE_ALIASES = {
  "自強店":   "旗艦店",
  "大里店":   "大里中興店",
};

// ── LINE 叫貨紀錄匯入 ──────────────────────────────────

function initLineOrderDate() {
  const today = new Date();
  document.getElementById("lineOrderDate").value = fmtDate(today);
  updateDeliveryHint();
}

function updateDeliveryHint() {
  const val = document.getElementById("lineOrderDate").value;
  if (!val) { document.getElementById("lineDeliveryHint").textContent = ""; return; }
  const d = new Date(val + "T00:00:00");
  d.setDate(d.getDate() + 1);
  const [y,m,dy] = fmtDate(d).split("-");
  document.getElementById("lineDeliveryHint").textContent =
    `→ 將上傳至到貨日：${y}年${parseInt(m)}月${parseInt(dy)}日`;
  document.getElementById("linePreview").style.display = "none";
  document.getElementById("lineUploadBtn").style.display = "none";
}

let _parsedLineOrders = {};   // { storeName: qty }
let _parsedUnknown = [];      // unrecognized lines

function parseLineText() {
  const text = document.getElementById("lineText").value;
  const lines = text.split("\n");
  const storeNames = STORES.map(s => s.n);
  // 正式名稱 + 別名都列入搜尋
  const aliasKeys = Object.keys(STORE_ALIASES);
  const result = {};
  const unknown = [];

  lines.forEach(raw => {
    const line = raw.trim();
    if (!line) return;

    // 先試別名，再試正式名稱
    let matched = aliasKeys.find(a => line.includes(a));
    if (matched) {
      matched = STORE_ALIASES[matched];  // 轉成正式名稱
    } else {
      matched = storeNames.find(n => line.includes(n));
    }

    if (!matched) {
      // 可能是 LINE 系統訊息或空白，略過常見模式
      if (/^\[/.test(line) || /^-+$/.test(line) || /^\d{1,2}:\d{2}/.test(line)) return;
      unknown.push(line);
      return;
    }

    // 從這行取出數字（優先取門市名稱後面的數字）
    const after = line.slice(line.indexOf(matched) + matched.length);
    const numMatch = after.match(/(\d+)/) || line.match(/(\d+)/);
    const qty = numMatch ? parseInt(numMatch[1]) : 0;
    if (qty > 0) {
      result[matched] = (result[matched] || 0) + qty;
    } else {
      unknown.push(line);
    }
  });

  _parsedLineOrders = result;
  _parsedUnknown = unknown;

  const preview = document.getElementById("linePreview");
  const uploadBtn = document.getElementById("lineUploadBtn");
  const entries = Object.entries(result);

  if (!entries.length && !unknown.length) {
    preview.style.display = "block";
    preview.innerHTML = '<div style="color:#999;font-size:0.88rem;">未解析到任何訂單，請確認格式。</div>';
    uploadBtn.style.display = "none";
    return;
  }

  const totalQty = entries.reduce((s, [,q]) => s + q, 0);
  let html = `<div class="line-preview-title">解析結果：${entries.length} 家 / ${totalQty} 包</div>`;
  entries.forEach(([n, q]) => {
    html += `<div class="line-preview-item"><span>${n}</span><span>${q} 包</span></div>`;
  });
  if (unknown.length) {
    html += `<div class="line-preview-warn">⚠ 無法辨識 ${unknown.length} 行（已略過）：<br>` +
      unknown.slice(0,5).map(l => `・${l}`).join("<br>") +
      (unknown.length > 5 ? `<br>…等 ${unknown.length} 行` : "") + "</div>";
  }

  preview.style.display = "block";
  preview.innerHTML = html;
  uploadBtn.style.display = entries.length ? "block" : "none";
}

async function uploadLineOrders() {
  const orderDate = document.getElementById("lineOrderDate").value;
  if (!orderDate) { toast("請選擇下單日"); return; }

  const d = new Date(orderDate + "T00:00:00");
  d.setDate(d.getDate() + 1);
  const deliveryDate = fmtDate(d);

  const entries = Object.entries(_parsedLineOrders);
  if (!entries.length) { toast("沒有可上傳的訂單"); return; }

  const btn = document.getElementById("lineUploadBtn");
  btn.disabled = true;
  btn.textContent = "上傳中…";

  const docId = `五鮮級_${deliveryDate}`;
  const stores = {};
  entries.forEach(([n, q]) => { stores[n] = q; });

  try {
    await db.collection("orders_wuxian").doc(docId).set(
      { stores, date: deliveryDate, updatedAt: new Date().toISOString() },
      { merge: true }
    );
    toast(`✓ 已上傳 ${entries.length} 家訂單 → ${deliveryDate} 到貨日`);
    document.getElementById("linePreview").style.display = "none";
    document.getElementById("lineText").value = "";
    btn.style.display = "none";
    // 切換到剛上傳的到貨日
    setDate(deliveryDate);
    document.getElementById("adminDate").value = deliveryDate;
  } catch(e) {
    toast("上傳失敗：" + e.message);
  } finally {
    btn.disabled = false;
    btn.textContent = "⬆ 上傳到貨日";
  }
}

// ── Toast ─────────────────────────────────────────────
let _toastTimer;
function toast(msg) {
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.style.opacity = 1;
  clearTimeout(_toastTimer);
  _toastTimer = setTimeout(() => el.style.opacity = 0, 2400);
}
</script>
